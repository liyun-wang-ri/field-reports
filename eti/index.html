const SCHEMA={"associations":["Money","Business and companies","Human behaviour","Choices","Scarcity","Trade-offs","Incentives","Government policy","Fairness","Sustainability","Data and evidence","Decision-making","Understanding how the real world works","Noticing hidden trade-offs in daily life"],"habits":["What are the trade-offs?","Who benefits?","Who bears the cost?","What incentives are created?","Could there be unintended consequences?","What evidence supports this claim?","What assumptions am I making?","Is this efficient?","Is this fair?","What happens in the long run?"],"beliefs":["Most economic problems have one best solution.","Higher prices are usually bad for society.","Large company profits usually mean consumers are being exploited.","Governments generally solve problems better than markets.","Markets generally solve problems better than governments.","Buying imported goods is generally bad for Singapore.","New technology mainly destroys jobs.","If GDP increases, people’s lives usually improve.","The fairest policy is usually the one that gives everyone the same.","Economics is mainly about money.","If everyone acts in their own interest, society ends up best off.","A policy that worked in one country will usually work in another.","If something is free to use, it costs society nothing.","Policies with good intentions usually produce good results."],"goals":["Understanding how the economy works","Doing well in examinations","Explaining current affairs","Developing critical thinking","Learning useful life skills","Preparing for university or future work"],"motives":["I want to understand how the world works.","I enjoy current affairs.","I want to do well in the A-Level examination.","H1 Economics fits my subject combination.","Economics may be useful for my future career.","I want to become a more informed citizen.","I enjoy analysing real-world issues.","I mainly want to pass the subject.","Other"],"curiosity":["I read or watched something about an economic or social issue outside lessons.","I discussed an economic or social issue with friends or family outside lessons.","I sought more information because I was curious about an economic or social issue."],"scenarios":[["B1","Plastic bags","Imagine Singapore increases a disposable plastic bag charge from $0.20 to $1 per bag. What do you think would happen? Explain your reasoning."],["B2","AI at work","A company replaces half its customer service workers with AI. Who might gain, who might lose, and could society still become better off overall? Explain."],["B3","Public budget","Singapore has an additional $2 billion available. Choose ONE use: healthcare, public transport, defence, climate adaptation, education, or tax cuts. Which would you choose, why, and what are we giving up by making this choice?"],["B4","Housing","Housing prices are rising rapidly. Rank these options from most effective (1) to least effective (5): build more housing; introduce price controls; tax investors; subsidise buyers; leave the market alone. Explain your top choice."],["B5","Fast fashion","Someone says: “The government should ban fast fashion because it pollutes.” What is your first reaction? Explain your reasoning."]],"headline":{"JC1":"Singapore considers higher charges for cars entering busy city areas.","JC2":"Singapore considers higher charges for water use during dry periods."},"reflection":["Which answer or belief changed the most since JC1? Why?","What is one assumption or idea you had to unlearn or relearn?","What experience, lesson, or real-world issue most influenced how you now think?","Which economic question or issue are you still curious or uncertain about?"]};
/* ===== ETI FEEDBACK CORE — identical copy in Code.gs and index.html. Edit wording in the Feedback_Text sheet, not here. ===== */
const FB_DEFAULTS = {
  'threshold.interest': '55',
  'threshold.exam': '55',

  'persona.explorer.icon': '🧭',
  'persona.explorer.name': 'The Explorer',
  'persona.explorer.tagline': 'Curious first, exams second.',
  'persona.explorer.body': 'You chose Economics because you want to understand how the world works, and you would keep learning even without an exam at the end. Explorers notice economic questions everywhere — in the news, at the hawker centre, in conversations at home.',
  'persona.explorer.strengths': 'Curiosity, a willingness to follow a question wherever it leads, and a feel for real-world issues.',
  'persona.explorer.try': 'Turn curiosity into structure. When something catches your eye, write two sentences: what is happening, and who gains or loses. That habit becomes strong exam reasoning later.',
  'persona.explorer.track': 'interest',
  'persona.explorer.teacher': 'Likely to thrive with inquiry, case studies and real-world projects. Check that exam technique keeps pace.',

  'persona.strategist.icon': '♟️',
  'persona.strategist.name': 'The Strategist',
  'persona.strategist.tagline': 'Curious and results-minded.',
  'persona.strategist.body': 'You are interested in how the economy works, and you also care about doing well in the A-Levels. Strategists like to understand ideas properly and then put them to work — in discussions and in exams.',
  'persona.strategist.strengths': 'Balance: you can enjoy the ideas and still keep the end goal in sight.',
  'persona.strategist.try': 'Look for moments where the two meet. When you read about a real issue, ask yourself how you would turn it into a well-argued exam answer.',
  'persona.strategist.track': 'balanced',
  'persona.strategist.teacher': 'Can probably choose either pathway — offer the choice. Stretch with evaluation and judgement.',

  'persona.navigator.icon': '🎯',
  'persona.navigator.name': 'The Navigator',
  'persona.navigator.tagline': 'Clear destination, efficient route.',
  'persona.navigator.body': 'Doing well in the A-Levels matters a lot to you right now, and you like knowing exactly what is expected. Navigators are focused and organised — real strengths for a two-year course.',
  'persona.navigator.strengths': 'Focus, discipline and a clear sense of what you are working towards.',
  'persona.navigator.try': 'Take one detour a month: an article, a video or a conversation about an economic issue. Examiners reward real-world examples — and you may find a topic you genuinely enjoy.',
  'persona.navigator.track': 'exam',
  'persona.navigator.teacher': 'Likely to value structured, exam-skills-focused lessons. Build in short real-world hooks to grow interest.',

  'persona.wanderer.icon': '🌱',
  'persona.wanderer.name': 'The Wanderer',
  'persona.wanderer.tagline': 'Still finding where Economics fits.',
  'persona.wanderer.body': 'Neither the subject nor the exam has grabbed you strongly yet — and that is completely normal at the start. Many students only discover what interests them once they begin exploring. Wanderers have the most room to be surprised.',
  'persona.wanderer.strengths': 'An open mind. You have not decided what Economics is "for" yet, so you can come to it fresh.',
  'persona.wanderer.try': 'Start from something you already care about — food prices, transport, your phone, a part-time job — and ask how Economics explains it.',
  'persona.wanderer.track': 'balanced',
  'persona.wanderer.teacher': 'Worth an early, low-pressure conversation. Relatable, activity-rich starts may spark interest; check in again after Term 1.',

  'habit.0': 'Whenever someone makes a choice, ask: what did they give up to get it?',
  'habit.1': 'Before deciding whether a policy is good, list who gains from it — consumers, firms, workers, the government.',
  'habit.2': 'Follow the cost: who ends up paying, directly or indirectly?',
  'habit.3': 'Ask how a change makes people or firms behave differently. People respond to incentives.',
  'habit.4': 'Ask "and then what?" twice. The second answer often reveals an unintended effect.',

function fbNum(v) { if (v === '' || v === null || v === undefined) return null; const n = Number(String(v).replace(/^'/, '')); return isFinite(n) ? n : null; }
function fbYes(v) { return v === true || String(v).toUpperCase() === 'TRUE'; }
function fbMean(xs) { const v = xs.filter(x => x !== null && x !== undefined && isFinite(x)); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; }
function fbFill(s, vars) { return String(s == null ? '' : s).replace(/\{(\w+)\}/g, (m, k) => vars[k] !== undefined && vars[k] !== null ? vars[k] : m); }

/** Interest and exam-focus indices (0–100) and curiosity mean (0–3), from closed questions only. */
function fbIndices(a) {
  const motivesAnswered = SCHEMA.motives.some((_, i) => fbYes(a['G1_' + i]));
  const count = ids => ids.filter(i => fbYes(a['G1_' + i])).length;
  const s7 = v => v === null ? null : (v - 1) / 6;
  const g3 = fbNum(a.G3);
  const cur = fbMean([0, 1, 2].map(i => fbNum(a['F_' + i])));
  const interest = fbMean([
    motivesAnswered ? Math.min(count([0, 1, 5, 6]), 3) / 3 : null,   // intrinsic reasons in G1
    fbMean([0, 2, 3].map(i => s7(fbNum(a['G2_' + i])))),             // understanding, current affairs, critical thinking
    cur === null ? null : cur / 3,                                    // curiosity outside lessons
    s7(g3),                                                           // effort without the exam
  ]);
  const exam = fbMean([
    motivesAnswered ? Math.min(count([2, 7]), 2) / 2 : null,          // do well in A-Level / mainly pass
    s7(fbNum(a.G2_1)),                                                // importance of exams
    g3 === null ? null : (7 - g3) / 6,                                // effort would drop without the exam
  ]);
  return {
    interest: interest === null ? null : Math.round(interest * 100),
    exam: exam === null ? null : Math.round(exam * 100),
    curiosity: cur === null ? null : Math.round(cur * 10) / 10,
  };
}
function fbPersonaId(ix, T) {
  if (ix.interest === null || ix.exam === null) return '';
  const hiI = ix.interest >= Number(T['threshold.interest'] || 55), hiE = ix.exam >= Number(T['threshold.exam'] || 55);
  return hiI ? (hiE ? 'strategist' : 'explorer') : (hiE ? 'navigator' : 'wanderer');
}
function fbPersona(id, T) {
  if (!id) return null;
  const g = k => T['persona.' + id + '.' + k] || '';
  return { id, icon: g('icon'), name: g('name'), tagline: g('tagline'), body: g('body'), strengths: g('strengths'), tryThis: g('try'), track: g('track'), teacher: g('teacher') };
}

/** Builds all templated feedback for one response. prior = the same student's JC1 answers (for JC2). */
function buildFeedback(a, mode, texts, prior, cohort) {
  const T = Object.assign({}, FB_DEFAULTS, texts || {});
  const ix = fbIndices(a), pid = fbPersonaId(ix, T), persona = fbPersona(pid, T);
  const rated = (prefix, n) => Array.from({ length: n }, (_, i) => ({ i, v: fbNum(a[prefix + i]) })).filter(x => x.v !== null);
  const habits = rated('D1_', SCHEMA.habits.length);
  const habitsOften = habits.filter(h => h.v >= 5).sort((x, y) => y.v - x.v).slice(0, 3).map(h => ({ question: SCHEMA.habits[h.i], rating: h.v }));
  const habitsToTry = habits.filter(h => h.v <= 4).sort((x, y) => x.v - y.v).slice(0, 2).map(h => ({ question: SCHEMA.habits[h.i], rating: h.v, tip: T['habit.' + h.i] || '' }));
  const beliefs = rated('E1_', SCHEMA.beliefs.length).filter(b => b.v >= 5).sort((x, y) => y.v - x.v).slice(0, 3)
    .map(b => ({ statement: SCHEMA.beliefs[b.i], rating: b.v, prompt: T['belief.' + b.i] || '' }));
  const curiosity = ix.curiosity === null ? '' : T[ix.curiosity < 1 ? 'curiosity.low' : ix.curiosity < 2 ? 'curiosity.mid' : 'curiosity.high'];

  let change = null;
  if (prior) {
    const px = fbIndices(prior), pp = fbPersona(fbPersonaId(px, T), T), lines = [];
    if (pp && persona) lines.push(pp.id === persona.id ? fbFill(T['change.persona_same'], { persona: persona.name }) : fbFill(T['change.persona_moved'], { from: pp.name, to: persona.name }));
    [['interest', 'interest'], ['exam', 'exam']].forEach(([k]) => {
      if (px[k] !== null && ix[k] !== null && Math.abs(ix[k] - px[k]) >= 10)
        lines.push(fbFill(T['change.' + k + (ix[k] > px[k] ? '_up' : '_down')], { a: px[k], b: ix[k] }));
    });
    const moved = SCHEMA.beliefs.map((s, i) => ({ s, a: fbNum(prior['E1_' + i]), b: fbNum(a['E1_' + i]) }))
      .filter(x => x.a !== null && x.b !== null && Math.abs(x.b - x.a) >= 2).sort((x, y) => Math.abs(y.b - y.a) - Math.abs(x.b - x.a)).slice(0, 4);
    moved.forEach(x => lines.push(fbFill(T['change.belief'], { statement: x.s, a: x.a, b: x.b })));
    const grew = SCHEMA.habits.map((q, i) => ({ q, a: fbNum(prior['D1_' + i]), b: fbNum(a['D1_' + i]) }))
      .filter(x => x.a !== null && x.b !== null && x.b - x.a >= 2).sort((x, y) => (y.b - y.a) - (x.b - x.a)).slice(0, 3);
    grew.forEach(x => lines.push(fbFill(T['change.habit'], { question: x.q, a: x.a, b: x.b })));
    if (lines.length <= 1 && !moved.length && !grew.length) lines.push(T['change.none']);
    change = { fromPersona: pp ? pp.name : '', toPersona: persona ? persona.name : '', lines,
      definitionThen: String(prior.A2 || '').replace(/^'/, ''), definitionNow: String(a.A2 || '').replace(/^'/, '') };
  }
  const cohortNote = cohort && cohort.n >= 20 ? fbFill(T['cohort.note'], cohort) : '';
  return { mode, indices: ix, persona, habitsOften, habitsToTry, beliefs, curiosity, change, cohort: cohortNote ? cohort : null, cohortNote, note: T['note.personas'] };
}

/** Plain-text version (download copy and teacher sheet). */
function feedbackText(fb) {
  if (!fb) return '';
  const L = [];
  if (fb.persona) L.push('YOUR ECONOMICS PERSONA: ' + fb.persona.name + ' — ' + fb.persona.tagline, fb.persona.body, 'What you bring: ' + fb.persona.strengths, 'Something to try: ' + fb.persona.tryThis, '');
  const ix = fb.indices || {};
  L.push('Interest in the subject: ' + (ix.interest ?? '—') + '/100 · Exam focus: ' + (ix.exam ?? '—') + '/100 · Curiosity: ' + (ix.curiosity ?? '—') + '/3');
  if (fb.cohortNote) L.push(fb.cohortNote);
  if (fb.curiosity) L.push(fb.curiosity);
  if (fb.habitsOften.length) L.push('', 'Questions you already ask often: ' + fb.habitsOften.map(h => h.question).join(' · '));
  if (fb.habitsToTry.length) { L.push('Questions to try asking more:'); fb.habitsToTry.forEach(h => L.push('  • ' + h.question + ' — ' + h.tip)); }
  if (fb.beliefs.length) { L.push('', 'Beliefs worth exploring:'); fb.beliefs.forEach(b => L.push('  • “' + b.statement + '” (you rated ' + b.rating + '/7) — ' + b.prompt)); }
  if (fb.change) { L.push('', 'How you have changed since JC1:'); fb.change.lines.forEach(l => L.push('  • ' + l)); }
  L.push('', fb.note);
  return L.join('\n');
}

 case 6:return `<div class="q"><h3>G1. Why ${state.mode==='JC1'?'are you taking':'did you take'} H1 Economics? Select up to THREE.</h3><div class="checklist">${SCHEMA.motives.map((s,i)=>`<label><input type="checkbox" data-key="G1_${i}" ${val('G1_'+i)?'checked':''}>${escapeHtml(s)}</label>`).join('')}</div><div class="field"><label>Other reason (optional)</label><input data-key="G1_other" value="${escapeHtml(val('G1_other'))}" placeholder="If you selected Other, specify here" /></div></div><div class="q"><h3>G2. How important are these goals to you?</h3>${ratingList('G2_',SCHEMA.goals,'Not important','Very important')}</div><div class="q"><h3>G3. If there were no A-Level examination for H1 Economics, how much effort do you think you would still put into learning the subject?</h3>${rating('G3','Your rating','Almost none','Just as much as now')}${field('G3_why','Why did you choose that rating?',2)}</div>${field('G4',state.mode==='JC1'?'G4. By the end of this course, what kind of person do you hope Economics will help you become?':'G4. What kind of person has Economics helped you become?',3)}`;
 case 7:return `<div class="notice">Complete this section only after answering the earlier sections. If you kept the copy of your JC1 answers, you may look at it now.</div>${SCHEMA.reflection.map((s,i)=>field('H'+(i+1),`H${i+1}. ${s}`,3)).join('')}`;
 }
}
function goToStep(i){collect();state.notice='';state.step=Math.max(0,Math.min(i,(state.mode==='JC2'?8:7)-1));state.view='form';render();window.scrollTo(0,0)}
function collect(){app.querySelectorAll('[data-key]').forEach(el=>{const k=el.dataset.key;if(el.type==='radio'){if(el.checked)set(k,el.value)}else if(el.type==='checkbox'){set(k,el.checked)}else set(k,el.value)});saveDraft();}
function render(){let s=state;
 const total=s.mode==='JC2'?8:7;
 if(s.view==='login'){
 app.innerHTML=`<div class="landing-hero"><div class="hero-copy"><div class="eyebrow">A JOURNEY IN ECONOMIC THINKING</div><h1>How do you <em>see</em><br>the world?</h1><p>Every choice has a story. Explore what you notice, what you believe, and how you make sense of the world around you.</p><div class="hero-pills"><span>01 · Think</span><span>02 · See</span><span>03 · Engage</span></div></div><div class="hero-art">${art('hero')}</div></div><div class="welcome-grid"><div class="intro-card"><span class="eyebrow">YOUR JOURNEY</span><h2>Start where you are.</h2><p>This is not a test of what you know. There are no model answers. We want to hear what you genuinely think.</p><div class="trust-note">This does not affect your grades. Answer what you really think.</div><p class="smallprint" style="font-size:12px;color:#627675"><b>How your answers are used.</b> Your answers are saved with your student ID so your Economics teachers can understand your interests and how you think, and plan learning pathways that suit you. An AI tool helps teachers summarise answers; it sees your answers but not your name or student ID, and teachers make every decision. At the end of JC2 you will be able to see how your thinking has changed.</p>${DEMO?'<div class="notice warn">Preview mode · Your responses will not be submitted to Google Sheets.</div>':''}</div><div class="login-card"><div class="eyebrow">STEP 01 / GET STARTED</div><h2>Your inventory</h2><label class="choice-label">Choose your stage</label><div class="mode"><button class="btn ${s.mode==='JC1'?'':'alt'}" data-mode="JC1" ${modeLocked('JC1')}>JC1 · Beginning</button><button class="btn ${s.mode==='JC2'?'':'alt'}" data-mode="JC2" ${modeLocked('JC2')}>JC2 · Looking back</button></div>${!DEMO&&s.openStage==='CLOSED'?'<div class="notice warn">The inventory is not open right now. Your teacher will tell you when to start.</div>':''}${s.configError?'<div class="notice error">Cannot reach the inventory server. Check your internet connection, then refresh this page.</div>':''}<div class="field"><label>Student ID</label><input id="loginId" autocomplete="off" autocapitalize="characters" placeholder="Your school student ID" value="${escapeHtml(s.id)}"></div><div class="field"><label>Access code</label><input id="loginKey" type="password" autocomplete="off" autocapitalize="characters" placeholder="8 characters, e.g. ABCD-EFGH" value="${escapeHtml(s.key)}"></div>${s.error?`<div class="notice error">${escapeHtml(s.error)}</div>`:''}<button class="btn primary-wide" id="begin" ${s.busy||(!DEMO&&s.openStage==='CLOSED')?'disabled':''}>${s.busy?'Checking…':'Begin the journey →'}</button><p class="smallprint">Use the same student ID and access code for JC1 and JC2.</p></div></div>`;
 app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{s.mode=b.dataset.mode;s.error='';render()});app.querySelector('#begin').onclick=login;return;
 }
 if(s.view==='done'){
 const fb=(s.summary&&s.summary.feedback)||null;
 app.innerHTML=`<div class="success"><div class="completion-art">${art('hero')}</div><span class="eyebrow">JOURNEY COMPLETE</span><h1>Thank you for sharing your perspective.</h1><p>Your responses do not affect your grades.</p><span class="chip">Receipt: ${escapeHtml(s.receipt)}</span>${DEMO?'<div class="notice warn">Preview only — nothing was saved.</div>':''}${fb?renderFeedback(fb):'<p>Your responses have been recorded.</p>'}<p style="text-align:center"><button class="btn alt" id="saveCopy">⬇ Download my answers and feedback</button></p><p class="note">Keep your access code safe — you will use it again for the JC2 inventory.</p></div>`;app.querySelector('#saveCopy').onclick=downloadCopy;return;
 }
 if(s.view==='review'){
 app.innerHTML=`<div class="review-wrap"><div class="chapter-head"><span class="eyebrow">ONE LAST LOOK</span><h2 class="sectiontitle">Ready to submit?</h2><p>Review your journey. Select any chapter to revisit and edit your responses.</p></div><div class="review">${sections.slice(0,total).map(([l,t],i)=>`<button type="button" class="review-card" data-goto="${i}" aria-label="Review section ${l}: ${escapeHtml(t)}"><span class="review-letter">${l}</span><strong>${escapeHtml(t)}</strong><span class="review-edit">Review ↗</span></button>`).join('')}</div><div class="notice">Submitting saves your responses to the school's Google Sheet under your student ID.</div><p class="note-compact">After submitting, you can download a copy of your answers for your own records.</p>${s.error?`<div class="notice error">${escapeHtml(s.error)}</div>`:''}<div class="btnrow"><button class="btn alt" id="back">← Back</button><button class="btn" id="submit" ${s.busy?'disabled':''}>${s.busy?'Submitting…':'Submit my responses →'}</button></div></div>`;
 app.querySelector('#back').onclick=()=>goToStep(total-1);
 app.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>goToStep(Number(b.dataset.goto)));
 app.querySelector('#submit').onclick=submit;return;
 }
 let [letter,title]=sections[s.step];const meta=chapterMeta[s.step];
 app.innerHTML=`<div class="form-layout"><aside class="journey-nav"><div class="eyebrow">YOUR JOURNEY</div><h3>${s.mode} Inventory</h3><div class="chapter-list">${sections.slice(0,total).map(([l,t],i)=>`<button type="button" data-goto="${i}" class="chapter-link ${i===s.step?'active':''} ${i<s.step?'past':''}"><span>${i<s.step?'✓':l}</span><small>${escapeHtml(t)}</small></button>`).join('')}</div><div class="sidebar-foot">Your answers are saved on this device as you go, until you submit.</div></aside><div class="question-area"><div class="mobile-jump-wrap"><label for="mobileJump">Jump to a chapter</label><select id="mobileJump" class="mobile-jump">${sections.slice(0,total).map(([l,t],i)=>`<option value="${i}" ${i===s.step?'selected':''}>${l} · ${escapeHtml(t)}</option>`).join('')}</select></div><div class="steps"><span>${s.mode} · SECTION ${letter}</span><span>${s.step+1} OF ${total}</span></div><div class="progress"><div style="width:${((s.step+1)/total)*100}%"></div></div><div class="chapter-head ${meta[2]}"><span class="eyebrow">CHAPTER ${String(s.step+1).padStart(2,'0')}</span><h2 class="sectiontitle">${escapeHtml(meta[0])}</h2><p>${escapeHtml(meta[1])}</p></div>${s.notice?`<div class="notice">${escapeHtml(s.notice)}</div>`:''}<div class="questions">${sectionBody(s.step)}</div><div class="btnrow"><button class="btn alt" id="back">← ${s.step===0?'Start':'Previous'}</button><button class="btn" id="next">${s.step===total-1?'Review answers':'Continue →'}</button></div><p class="smallprint">You can return to earlier sections. If you close the tab, sign in again on the same device to continue.</p></div></div>`;
 app.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>goToStep(Number(b.dataset.goto)));app.querySelector('#mobileJump').onchange=e=>goToStep(Number(e.target.value));
 app.querySelector('#back').onclick=()=>{collect();if(s.step===0){s.view='login'}else s.step--;render();window.scrollTo(0,0)};
 app.querySelector('#next').onclick=()=>{collect();if(s.step===total-1){s.view='review'}else s.step++;render();window.scrollTo(0,0)};
}
function localSummary(a,mode){return {feedback:buildFeedback(a,mode,{},null,null)}}
function meter(label,val,max,avg,hint){const pct=val==null?0:Math.max(2,Math.round(val/max*100));const ap=avg==null||avg==='—'?null:Math.round(avg/max*100);return `<div class="meter"><div class="meter-top"><span>${label}</span><b>${val??'—'}<small> / ${max}</small></b></div><div class="meter-track"><div class="meter-fill" style="width:${pct}%"></div>${ap!==null?`<div class="meter-avg" style="left:${ap}%" title="Cohort average"></div>`:''}</div><small class="meter-hint">${hint}</small></div>`}
function renderFeedback(fb){const p=fb.persona,ix=fb.indices||{},co=fb.cohort;let h='';
 if(p)h+=`<section class="persona"><div class="persona-icon" aria-hidden="true">${escapeHtml(p.icon)}</div><div><span class="eyebrow">YOUR ECONOMICS PERSONA</span><h2>${escapeHtml(p.name)}</h2><p class="persona-tag">${escapeHtml(p.tagline)}</p></div></section><p class="persona-body">${escapeHtml(p.body)}</p><div class="fb-grid"><div class="fb-box"><h3>What you bring</h3><p>${escapeHtml(p.strengths)}</p></div><div class="fb-box try"><h3>Something to try</h3><p>${escapeHtml(p.tryThis)}</p></div></div>`;
 h+=`<div class="meters">${meter('Interest in the subject',ix.interest,100,co&&co.interest,'Why you study it: curiosity, current affairs, effort even without the exam')}${meter('Exam focus',ix.exam,100,co&&co.exam,'How much the A-Level exam drives you right now')}${meter('Curiosity outside lessons',ix.curiosity,3,null,'Past month: reading, discussing, looking things up')}</div>`;
 if(fb.cohortNote)h+=`<p class="note-compact"><span class="avg-key"></span>${escapeHtml(fb.cohortNote)}</p>`;
 if(fb.curiosity)h+=`<p class="fb-line">${escapeHtml(fb.curiosity)}</p>`;
 if(fb.habitsOften.length||fb.habitsToTry.length){h+=`<h3 class="fb-h">Your thinking habits</h3>`;
  if(fb.habitsOften.length)h+=`<p class="note-compact">Questions you already ask often:</p><div class="chips">${fb.habitsOften.map(x=>`<span class="chip-q">${escapeHtml(x.question)}</span>`).join('')}</div>`;
  if(fb.habitsToTry.length)h+=`<p class="note-compact">Questions to try asking more:</p><ul class="fb-list">${fb.habitsToTry.map(x=>`<li><b>${escapeHtml(x.question)}</b><br>${escapeHtml(x.tip)}</li>`).join('')}</ul>`;}
 if(fb.beliefs.length)h+=`<h3 class="fb-h">Ideas worth exploring</h3><p class="note-compact">You agreed with these statements. There is no right answer — here is another angle to test as you learn.</p><ul class="fb-list">${fb.beliefs.map(b=>`<li><b>“${escapeHtml(b.statement)}”</b><span class="pill">you: ${b.rating}/7</span><br>${escapeHtml(b.prompt)}</li>`).join('')}</ul>`;
 if(fb.change){h+=`<h3 class="fb-h">How you have changed since JC1</h3><ul class="fb-list">${fb.change.lines.map(l=>`<li>${escapeHtml(l)}</li>`).join('')}</ul>`;
  if(fb.change.definitionThen||fb.change.definitionNow)h+=`<div class="fb-grid"><div class="fb-box"><h3>JC1 · “Economics is the study of…”</h3><p>${escapeHtml(fb.change.definitionThen||'—')}</p></div><div class="fb-box try"><h3>JC2 · “Economics is the study of…”</h3><p>${escapeHtml(fb.change.definitionNow||'—')}</p></div></div>`;}
 h+=`<p class="note-compact persona-note">${escapeHtml(fb.note)}</p>`;
 return `<div class="feedback">${h}</div>`;}
/* ---------- Server connection (GitHub Pages → Apps Script) ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function api(action,payload,tries=1){
 let last;
 for(let i=0;i<tries;i++){
  try{
   // text/plain avoids a CORS preflight, which Apps Script cannot answer.
   const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},payload)),redirect:'follow'});
   if(!res.ok)throw new Error('HTTP '+res.status);
   const data=await res.json();
   if(data.retry&&i<tries-1){await sleep(Math.min(15000,1000*2**i)+Math.random()*2000);continue}
   return data;
  }catch(e){last=e;if(i<tries-1)await sleep(Math.min(15000,1000*2**i)+Math.random()*2000)}
 }
 throw last||new Error('Could not reach the server.');
}
function modeLocked(m){return(!DEMO&&state.openStage&&state.openStage!==m)?'disabled title="Not open right now"':''}
async function loadConfig(){
 if(DEMO)return;
 try{const r=await api('config',{},3);state.openStage=r.openStage||'CLOSED';if(['JC1','JC2'].includes(state.openStage))state.mode=state.openStage;state.configError=false}
 catch(e){state.configError=true}
 if(state.view==='login')render();
}
/* ---------- Draft autosave on this device (cleared after submitting) ---------- */
function draftKey(){return 'eti-draft:'+state.mode+':'+state.id}
function saveDraft(){if(!state.id||!(state.view==='form'||state.view==='review'))return;try{localStorage.setItem(draftKey(),JSON.stringify({answers:state.answers,step:state.step,token:state.token,startedAt:state.startedAt,savedAt:Date.now()}))}catch(e){}}
function loadDraft(){try{return JSON.parse(localStorage.getItem(draftKey())||'null')}catch(e){return null}}
function clearDraft(){try{localStorage.removeItem(draftKey())}catch(e){}}
function newToken(){const b=new Uint8Array(6);crypto.getRandomValues(b);return Array.from(b,x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()}
function startForm(){
 const d=loadDraft(),total=state.mode==='JC2'?8:7;
 if(d&&d.answers&&Object.keys(d.answers).length){state.answers=d.answers;state.step=Math.min(d.step||0,total-1);state.token=d.token||newToken();state.startedAt=d.startedAt||Date.now();state.notice='Welcome back — we restored the answers saved on this device.'}
 else{state.answers={};state.step=0;state.token=newToken();state.startedAt=Date.now();state.notice=''}
 state.view='form';
}
async function login(){
 const s=state;s.id=app.querySelector('#loginId').value.trim().toUpperCase();s.key=app.querySelector('#loginKey').value.replace(/[\s-]/g,'').toUpperCase();s.error='';
 if(DEMO){startForm();render();return}
 if(!s.id||!s.key){s.error='Enter the assigned student ID and private access key.';render();return}
 s.busy=true;render();
 try{const r=await api('verify',{studentId:s.id,accessKey:s.key,mode:s.mode},3);s.busy=false;if(r.ok)startForm();else s.error=r.message||'Unable to sign in.'}
 catch(e){s.busy=false;s.error='Could not reach the server. Check your internet connection and try again.'}
 render();
}
async function submit(){
 const s=state;s.error='';
 const motives=SCHEMA.motives.map((_,i)=>i).filter(i=>s.answers['G1_'+i]===true);
 if(motives.length>3){s.error='Please select at most three motivations in Section G.';render();return}
 if(!Object.values(s.answers).some(v=>v!==false&&String(v).trim())){s.error='Please answer at least one question before submitting.';render();return}
 const finish=(receipt,summary)=>{s.summary=summary&&summary.feedback?summary:localSummary(s.answers,s.mode);s.copy=buildCopy(s.answers,s.mode,receipt)+'\n\n========== YOUR FEEDBACK ==========\n\n'+feedbackText(s.summary.feedback);s.receipt=receipt;clearDraft();s.view='done';s.key='';s.answers={}};
 if(DEMO){finish('DEMO-'+newToken().slice(0,6),localSummary(s.answers,s.mode));render();return}
 s.busy=true;render();
 try{const r=await api('submit',{studentId:s.id,accessKey:s.key,mode:s.mode,answers:s.answers,clientToken:s.token,startedAt:s.startedAt},6);s.busy=false;
  if(r.ok)finish(r.receipt,r.summary);else s.error=(r.message||'Submission failed.')+(r.retry?'':' Your answers are still saved on this device.')}
 catch(e){s.busy=false;s.error='Could not reach the server. Your answers are saved on this device — check your connection and press Submit again.'}
 render();
}
/* ---------- Student copy (replaces email, which cannot work across domains) ---------- */
function buildCopy(a,mode,receipt){
 const L=['Economic Thinking Inventory — '+mode,'Receipt: '+receipt,'Saved: '+new Date().toLocaleString(),''];
 const add=(t,v)=>{if(v!==undefined&&v!==null&&v!==''&&v!==false)L.push(t,'   '+String(v).replace(/\n/g,'\n   '),'')};
 add('A2. Economics is the study of…',a.A2);
 SCHEMA.associations.forEach((t,i)=>add(`A1. How strongly you associate Economics with "${t}" (1–7)`,a['A1_'+i]));
 SCHEMA.scenarios.forEach(([id,title,p])=>add(`${id}. ${title} — ${p}`,a[id]));
 add('C1. Unlimited free electricity: would all economic problems disappear?',a.C1);
 [0,1,2].forEach(j=>add(`D2. Your question ${j+1} about “${SCHEMA.headline[mode]}”`,a['D2_'+j]));
 SCHEMA.habits.forEach((t,i)=>add(`D1. How often you ask "${t}" (1–7)`,a['D1_'+i]));
 SCHEMA.beliefs.forEach((t,i)=>add(`E1. Agreement with "${t}" (1–7)`,a['E1_'+i]));
 add('E2. Your explanation',a.E2);
 const F=['Never','Once','A few times','Weekly or more'];
 SCHEMA.curiosity.forEach((t,i)=>add(`F${i+1}. ${t}`,F[a['F_'+i]]));
 add('G1. Why you took H1 Economics',SCHEMA.motives.filter((_,i)=>a['G1_'+i]===true).join('; '));
 add('G1. Other reason',a.G1_other);
 SCHEMA.goals.forEach((t,i)=>add(`G2. Importance of "${t}" (1–7)`,a['G2_'+i]));
 add('G3. Effort if there were no A-Level exam (1–7)',a.G3);add('G3. Why',a.G3_why);
 add(mode==='JC1'?'G4. The person you hope Economics helps you become':'G4. The person Economics has helped you become',a.G4);
 if(mode==='JC2')SCHEMA.reflection.forEach((t,i)=>add(`H${i+1}. ${t}`,a['H'+(i+1)]));
 return L.join('\n');
}
function downloadCopy(){const u=URL.createObjectURL(new Blob([state.copy||''],{type:'text/plain;charset=utf-8'}));const x=document.createElement('a');x.href=u;x.download=`${state.receipt}-${state.mode}.txt`;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
app.addEventListener('input',()=>{if(state.view==='form')collect()});
app.addEventListener('change',()=>{if(state.view==='form')collect()});
window.addEventListener('beforeunload',e=>{if(state.view==='form'||state.view==='review'){e.preventDefault();e.returnValue=''}});
render();loadConfig();
</script></body></html>
