function fbNum(v) { if (v === '' || v === null || v === undefined) return null; const n = Number(String(v).replace(/^'/, '')); return isFinite(n) ? n : null; }
function fbYes(v) { return v === true || String(v).toUpperCase() === 'TRUE'; }
function fbMean(xs) { const v = xs.filter(x => x !== null && x !== undefined && isFinite(x)); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; }
function fbFill(s, vars) { return String(s == null ? '' : s).replace(/\{(\w+)\}/g, (m, k) => vars[k] !== undefined && vars[k] !== null ? vars[k] : m); }

/** Interest and exam-focus indices (0–100) and curiosity mean (0–3), from closed questions only. */
function fbIndices(a) {
  const motivesAnswered = SCHEMA.motives.some((_, i) => fbYes(a['G1_' + i]));
  const count = ids => ids.filter(i => fbYes(a['G1_' + i])).length;
  const s7 = v => v === null ? null : (v - 1) / 6;
  const g3 = fbNum(a.G3);
  const cur = fbMean([0, 1, 2].map(i => fbNum(a['F_' + i])));
  const interest = fbMean([
    motivesAnswered ? Math.min(count([0, 1, 5, 6]), 3) / 3 : null,   // intrinsic reasons in G1
    fbMean([0, 2, 3].map(i => s7(fbNum(a['G2_' + i])))),             // understanding, current affairs, critical thinking
    cur === null ? null : cur / 3,                                    // curiosity outside lessons
    s7(g3),                                                           // effort without the exam
  ]);
  const exam = fbMean([
    motivesAnswered ? Math.min(count([2, 7]), 2) / 2 : null,          // do well in A-Level / mainly pass
    s7(fbNum(a.G2_1)),                                                // importance of exams
    g3 === null ? null : (7 - g3) / 6,                                // effort would drop without the exam
  ]);
  return {
    interest: interest === null ? null : Math.round(interest * 100),
    exam: exam === null ? null : Math.round(exam * 100),
    curiosity: cur === null ? null : Math.round(cur * 10) / 10,
  };
}
function fbPersonaId(ix, T) {
  if (ix.interest === null || ix.exam === null) return '';
  const hiI = ix.interest >= Number(T['threshold.interest'] || 55), hiE = ix.exam >= Number(T['threshold.exam'] || 55);
  return hiI ? (hiE ? 'strategist' : 'explorer') : (hiE ? 'navigator' : 'wanderer');
}
function fbPersona(id, T) {
  if (!id) return null;
  const g = k => T['persona.' + id + '.' + k] || '';
  return { id, icon: g('icon'), name: g('name'), tagline: g('tagline'), body: g('body'), strengths: g('strengths'), tryThis: g('try'), track: g('track'), teacher: g('teacher') };
}

/** Builds all templated feedback for one response. prior = the same student's JC1 answers (for JC2). */
function buildFeedback(a, mode, texts, prior, cohort) {
  const T = Object.assign({}, FB_DEFAULTS, texts || {});
  const ix = fbIndices(a), pid = fbPersonaId(ix, T), persona = fbPersona(pid, T);
  const rated = (prefix, n) => Array.from({ length: n }, (_, i) => ({ i, v: fbNum(a[prefix + i]) })).filter(x => x.v !== null);
  const habits = rated('D1_', SCHEMA.habits.length);
  const habitsOften = habits.filter(h => h.v >= 5).sort((x, y) => y.v - x.v).slice(0, 3).map(h => ({ question: SCHEMA.habits[h.i], rating: h.v }));
  const habitsToTry = habits.filter(h => h.v <= 4).sort((x, y) => x.v - y.v).slice(0, 2).map(h => ({ question: SCHEMA.habits[h.i], rating: h.v, tip: T['habit.' + h.i] || '' }));
  const beliefs = rated('E1_', SCHEMA.beliefs.length).filter(b => b.v >= 5).sort((x, y) => y.v - x.v).slice(0, 3)
    .map(b => ({ statement: SCHEMA.beliefs[b.i], rating: b.v, prompt: T['belief.' + b.i] || '' }));
  const curiosity = ix.curiosity === null ? '' : T[ix.curiosity < 1 ? 'curiosity.low' : ix.curiosity < 2 ? 'curiosity.mid' : 'curiosity.high'];

  let change = null;
  if (prior) {
    const px = fbIndices(prior), pp = fbPersona(fbPersonaId(px, T), T), lines = [];
    if (pp && persona) lines.push(pp.id === persona.id ? fbFill(T['change.persona_same'], { persona: persona.name }) : fbFill(T['change.persona_moved'], { from: pp.name, to: persona.name }));
    [['interest', 'interest'], ['exam', 'exam']].forEach(([k]) => {
      if (px[k] !== null && ix[k] !== null && Math.abs(ix[k] - px[k]) >= 10)
        lines.push(fbFill(T['change.' + k + (ix[k] > px[k] ? '_up' : '_down')], { a: px[k], b: ix[k] }));
    });
    const moved = SCHEMA.beliefs.map((s, i) => ({ s, a: fbNum(prior['E1_' + i]), b: fbNum(a['E1_' + i]) }))
      .filter(x => x.a !== null && x.b !== null && Math.abs(x.b - x.a) >= 2).sort((x, y) => Math.abs(y.b - y.a) - Math.abs(x.b - x.a)).slice(0, 4);
    moved.forEach(x => lines.push(fbFill(T['change.belief'], { statement: x.s, a: x.a, b: x.b })));
    const grew = SCHEMA.habits.map((q, i) => ({ q, a: fbNum(prior['D1_' + i]), b: fbNum(a['D1_' + i]) }))
      .filter(x => x.a !== null && x.b !== null && x.b - x.a >= 2).sort((x, y) => (y.b - y.a) - (x.b - x.a)).slice(0, 3);
    grew.forEach(x => lines.push(fbFill(T['change.habit'], { question: x.q, a: x.a, b: x.b })));
    if (lines.length <= 1 && !moved.length && !grew.length) lines.push(T['change.none']);
    change = { fromPersona: pp ? pp.name : '', toPersona: persona ? persona.name : '', lines,
      definitionThen: String(prior.A2 || '').replace(/^'/, ''), definitionNow: String(a.A2 || '').replace(/^'/, '') };
  }
  const cohortNote = cohort && cohort.n >= 20 ? fbFill(T['cohort.note'], cohort) : '';
  return { mode, indices: ix, persona, habitsOften, habitsToTry, beliefs, curiosity, change, cohort: cohortNote ? cohort : null, cohortNote, note: T['note.personas'] };
}

/** Plain-text version (download copy and teacher sheet). */
function feedbackText(fb) {
  if (!fb) return '';
  const L = [];
  if (fb.persona) L.push('YOUR ECONOMICS PERSONA: ' + fb.persona.name + ' — ' + fb.persona.tagline, fb.persona.body, 'What you bring: ' + fb.persona.strengths, 'Something to try: ' + fb.persona.tryThis, '');
  const ix = fb.indices || {};
  L.push('Interest in the subject: ' + (ix.interest ?? '—') + '/100 · Exam focus: ' + (ix.exam ?? '—') + '/100 · Curiosity: ' + (ix.curiosity ?? '—') + '/3');
  if (fb.cohortNote) L.push(fb.cohortNote);
  if (fb.curiosity) L.push(fb.curiosity);
  if (fb.habitsOften.length) L.push('', 'Questions you already ask often: ' + fb.habitsOften.map(h => h.question).join(' · '));
  if (fb.habitsToTry.length) { L.push('Questions to try asking more:'); fb.habitsToTry.forEach(h => L.push('  • ' + h.question + ' — ' + h.tip)); }
  if (fb.beliefs.length) { L.push('', 'Beliefs worth exploring:'); fb.beliefs.forEach(b => L.push('  • “' + b.statement + '” (you rated ' + b.rating + '/7) — ' + b.prompt)); }
  if (fb.change) { L.push('', 'How you have changed since JC1:'); fb.change.lines.forEach(l => L.push('  • ' + l)); }
  L.push('', fb.note);
  return L.join('\n');
}

/* ---------- Required answers and section locking ---------- */
function required(step){
 switch(step){
  case 0:return ['A2',...SCHEMA.associations.map((_,i)=>'A1_'+i)];
  case 1:return SCHEMA.scenarios.map(s=>s[0]);
  case 2:return ['C1'];
  case 3:return ['D2_0','D2_1','D2_2',...SCHEMA.habits.map((_,i)=>'D1_'+i)];
  case 4:return [...SCHEMA.beliefs.map((_,i)=>'E1_'+i),'E2'];
  case 5:return SCHEMA.curiosity.map((_,i)=>'F_'+i);
  case 6:{const r=['G1',...SCHEMA.goals.map((_,i)=>'G2_'+i),'G3','G3_why','G4'];if(state.answers.G1_8===true)r.splice(1,0,'G1_other');return r}
  case 7:return ['H1','H2','H3','H4'];
 }return [];
}
function answered(k){
 if(k==='G1')return SCHEMA.motives.some((_,i)=>state.answers['G1_'+i]===true);
 const v=state.answers[k];return v!==undefined&&v!==null&&v!==false&&String(v).trim()!=='';
}
function missing(step){return required(step).filter(k=>!answered(k))}
function firstIncomplete(){for(let i=0;i<total();i++)if(missing(i).length)return i;return total()}
function canVisit(i){return i>=0&&i<total()&&i<=firstIncomplete()}
function doneCount(){let n=0;for(let i=0;i<total();i++)if(!missing(i).length)n++;return n}

function collect(){app.querySelectorAll('[data-key]').forEach(el=>{const k=el.dataset.key;if(el.type==='radio'){if(el.checked)set(k,el.value)}else if(el.type==='checkbox'){set(k,el.checked)}else set(k,el.value)});saveDraft()}

const SAMPLE_TEXT={
 A2:'how people, firms and governments make choices when resources are limited.',

// Closed answers that steer the sample towards each persona (with the default cut-offs).
const SAMPLE_PERSONA={
 explorer:{G1:[0,1,6],G2_0:7,G2_2:6,G2_3:7,G2_1:3,G3:7,F:[3,2,3]},
 strategist:{G1:[0,2,6],G2_0:7,G2_2:6,G2_3:6,G2_1:7,G3:4,F:[2,2,2]},
 navigator:{G1:[2,7,3],G2_0:3,G2_2:2,G2_3:3,G2_1:7,G3:2,F:[0,1,0]},
 wanderer:{G1:[3,4],G2_0:3,G2_2:3,G2_3:3,G2_1:3,G3:4,F:[0,0,1]}};
const rnd7=()=>String(1+Math.floor(Math.random()*7));
function sampleFill(step,persona){
 const a=state.answers,empty=k=>!answered(k),P=persona?SAMPLE_PERSONA[persona]:null,force=!!P;
 const put=(k,v)=>{if(force||empty(k))a[k]=String(v)};
 switch(step){
  case 0:if(empty('A2'))a.A2=SAMPLE_TEXT.A2;SCHEMA.associations.forEach((_,i)=>{if(empty('A1_'+i))a['A1_'+i]=rnd7()});break;
  case 1:SCHEMA.scenarios.forEach(([id])=>{if(empty(id))a[id]=SAMPLE_TEXT[id]});break;
  case 2:if(empty('C1'))a.C1=SAMPLE_TEXT.C1;break;
  case 3:[0,1,2].forEach(j=>{if(empty('D2_'+j))a['D2_'+j]=SAMPLE_TEXT.D2[state.mode][j]});SCHEMA.habits.forEach((_,i)=>{if(empty('D1_'+i))a['D1_'+i]=rnd7()});break;
  case 4:SCHEMA.beliefs.forEach((_,i)=>{if(empty('E1_'+i))a['E1_'+i]=rnd7()});if(empty('E2'))a.E2=SAMPLE_TEXT.E2;break;
  case 5:[0,1,2].forEach(i=>{if(P)a['F_'+i]=String(P.F[i]);else if(empty('F_'+i))a['F_'+i]=String(Math.floor(Math.random()*4))});break;
  case 6:{
   if(P||!answered('G1')){const pick=P?P.G1:[0,1,2,3,4,5,6,7].sort(()=>Math.random()-.5).slice(0,1+Math.floor(Math.random()*3));SCHEMA.motives.forEach((_,i)=>a['G1_'+i]=pick.includes(i))}
   if(a.G1_8===true&&empty('G1_other'))a.G1_other=SAMPLE_TEXT.G1_other;
   SCHEMA.goals.forEach((_,i)=>{const k='G2_'+i;if(P&&P[k]!==undefined)a[k]=String(P[k]);else if(empty(k))a[k]=rnd7()});
   if(P)a.G3=String(P.G3);else if(empty('G3'))a.G3=rnd7();
   if(empty('G3_why'))a.G3_why=SAMPLE_TEXT.G3_why;if(empty('G4'))a.G4=SAMPLE_TEXT.G4;break;}
  case 7:['H1','H2','H3','H4'].forEach(k=>{if(empty(k))a[k]=SAMPLE_TEXT[k]});break;
 }
}
function testerToolsHtml(){return `<div class="tester-tools"><b>Tester tools</b><div class="tt-row"><button type="button" class="btn ghost tt" data-fill="section">✎ Fill this section with sample answers</button></div><div class="tt-row"><span class="small">Or fill <b>every</b> section and go to review as:</span><div class="tt-btns">${[['explorer','🧭 Explorer'],['strategist','♟️ Strategist'],['navigator','🎯 Navigator'],['wanderer','🌱 Wanderer'],['random','🎲 Random']].map(([k,l])=>`<button type="button" class="btn ghost tt" data-fill-all="${k}">${l}</button>`).join('')}</div></div><p class="small">Only blank questions are filled, except that a persona button also sets the motivation, goal, effort and curiosity answers that decide the persona.</p></div>`}

function render(){const s=state;

  app.innerHTML=`<section class="hero"><div class="hero-in"><div class="hero-copy"><span class="kicker light">H1 Economics · A two-year journey</span><h1>How do you <span class="hl">see</span> the world?</h1><p>Every choice has a story. Explore what you notice, what you believe, and how you make sense of the world around you.</p><div class="pills"><span>01 · Think</span><span>02 · See</span><span>03 · Engage</span></div></div><div class="hero-art"><div class="bubble"><b class="host-name">Griffles</b><p>Hi! There are no right answers here — I just want to know how <b>you</b> see the world right now.</p></div><img src="${IMG}griffles-mic.webp" alt="Griffles, the Raffles griffin mascot"></div></div></section>
  <section class="welcome"><div class="intro"><span class="kicker">Your journey</span><h2>Start where you are.</h2><p>This is not a test of what you know. It takes about 30–40 minutes, in 7 short sections${s.mode==='JC2'?' (8 for JC2)':''}. Each section unlocks when you finish the one before, and you can go back to change answers any time before you submit.</p><div class="trust">This does not affect your grades. Answer what you really think.</div><p class="howused"><b>How your answers are used.</b> Your answers are saved with your student ID so your Economics teachers can understand your interests and how you think, and plan learning pathways that suit you. An AI tool may help teachers summarise answers; it sees your answers but not your name or student ID, and teachers make every decision.</p>${DEMO?'<div class="notice warn">Preview mode · nothing will be saved.</div>':''}</div>
  <div class="login-card"><span class="kicker">Step 01 · Get started</span><h2>Your inventory</h2><b>Choose your stage</b><div class="mode"><button class="btn ${s.mode==='JC1'?'':'off'}" data-mode="JC1" ${modeLocked('JC1')}>JC1 · Beginning</button><button class="btn ${s.mode==='JC2'?'':'off'}" data-mode="JC2" ${modeLocked('JC2')}>JC2 · Looking back</button></div>${!DEMO&&s.openStage==='CLOSED'?'<div class="notice warn">The inventory is not open right now. Your teacher will tell you when to start.</div>':''}${s.configError?'<div class="notice error">Cannot reach the inventory server. Check your internet connection, then refresh this page.</div>':''}<div class="field"><label for="loginId">Student ID</label><input id="loginId" autocomplete="off" autocapitalize="characters" placeholder="Your school student ID" value="${escapeHtml(s.id)}"></div><div class="field"><label for="loginKey">Access code</label><input id="loginKey" type="password" autocomplete="off" autocapitalize="characters" placeholder="8 characters, e.g. ABCD-EFGH" value="${escapeHtml(s.key)}"></div>${s.error?`<div class="notice error">${escapeHtml(s.error)}</div>`:''}<button class="btn wide" id="begin" ${s.busy||(!DEMO&&s.openStage==='CLOSED')?'disabled':''}>${s.busy?'Checking…':'Begin the journey →'}</button><p class="small">Use the same student ID and access code for JC1 and JC2.</p></div></section><section class="guides-wrap">${guidesHtml()}</section>`;
  const idIn=app.querySelector('#loginId'),keyIn=app.querySelector('#loginKey');
  const unlock=()=>{const t=idIn.value.trim().toUpperCase()==='TESTER';app.querySelectorAll('[data-mode]').forEach(b=>b.disabled=!t&&!!modeLocked(b.dataset.mode));if(!s.busy)app.querySelector('#begin').disabled=!t&&!DEMO&&s.openStage==='CLOSED'};
  idIn.addEventListener('input',unlock);unlock();
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{s.id=idIn.value.trim().toUpperCase();s.key=keyIn.value;s.mode=b.dataset.mode;s.error='';render()});
  app.querySelector('#begin').onclick=login;
  app.querySelector('#loginKey').onkeydown=e=>{if(e.key==='Enter')login()};
  return;
 }
 if(s.view==='done'){
  const fb=(s.summary&&s.summary.feedback)||null;
  app.innerHTML=`<div class="success">${host('griffles_mega','You made it! Here’s your snapshot — a starting point for conversations, not a label.')}<span class="kicker">Journey complete</span><h1>Thank you for sharing your perspective.</h1><p>Your responses do not affect your grades.</p><span class="receipt">Receipt: ${escapeHtml(s.receipt)}</span>${DEMO?'<div class="notice warn">Preview only — nothing was saved.</div>':''}${fb?renderFeedback(fb):'<p>Your responses have been recorded.</p>'}<div class="btnrow"><button class="btn" id="saveCopy">⬇ Download my answers and feedback</button></div><p class="small">${s.tester?'Tester mode: nothing was added to the real data.':'Keep your access code safe — you will use it again for the JC2 inventory.'}</p>${s.tester?'<div class="btnrow"><button class="btn ghost" id="again">Test again</button></div>':''}</div>`;
  const ag=app.querySelector('#again');if(ag)ag.onclick=()=>{s.view='login';s.tester=false;s.summary=null;s.error='';render();window.scrollTo(0,0)};
  app.querySelector('#saveCopy').onclick=downloadCopy;return;
 }
 if(s.view==='review'){
  if(firstIncomplete()<total()){s.view='form';s.step=firstIncomplete();return render()}
  app.innerHTML=`<div class="review-wrap">${host('griffles_mega','Nearly there! Check anything you want to change, then submit.')}<span class="kicker">One last look</span><h2 class="chapter-head" style="font-size:clamp(1.7rem,3.4vw,2.3rem);margin:.3rem 0">Ready to submit?</h2><p class="small">All sections are complete. Select any section to go back and edit it.</p><div class="review">${CHAPTERS.slice(0,total()).map((c,i)=>`<button type="button" class="review-card" data-goto="${i}"><span class="dot">✓</span><strong>${c.l} · ${escapeHtml(c.t)}</strong><span class="edit">Edit</span></button>`).join('')}</div><div class="notice">Submitting saves your responses to your school's Google Sheet under your student ID. After submitting you can download a copy.</div>${s.error?`<div class="notice error">${escapeHtml(s.error)}</div>`:''}<div class="btnrow"><button class="btn ghost" id="back">← Back</button><button class="btn" id="submit" ${s.busy?'disabled':''}>${s.busy?'Submitting…':'Submit my responses →'}</button></div></div>`;
  app.querySelector('#back').onclick=()=>goToStep(total()-1);bindNav();app.querySelector('#submit').onclick=submit;return;
 }
 if(!canVisit(s.step))s.step=Math.min(firstIncomplete(),total()-1);
 const c=CHAPTERS[s.step],last=s.step===total()-1;
 app.innerHTML=`<div class="form-layout"><aside class="side"><span class="kicker light">Your journey</span><h3>${s.mode} inventory</h3><div class="progress-host"></div><nav class="chapter-list" id="sideList" aria-label="Sections"></nav><p class="side-foot">Sections unlock as you finish each one. You can go back to any finished section. Answers save on this device as you go.</p></aside>
  <section class="main"><div class="mobile-bar"><div class="progress-host"></div><label class="hidden" for="mobileJump">Jump to a section</label><select id="mobileJump" class="mobile-jump"></select></div>
  <header class="chapter-head"><span class="kicker">Chapter ${String(s.step+1).padStart(2,'0')} · Section ${c.l}</span><h2>${escapeHtml(c.t)}</h2><p>${escapeHtml(c.sub)}</p></header>
  ${s.tester?'<div class="notice warn"><b>Tester mode.</b> Answers go to the Test_Responses tab, not the real data. You can submit as often as you like.</div>':''}${s.tester||DEMO?testerToolsHtml():''}${host(c.host,c.line)}<div id="countHost"></div>${s.notice?`<div class="notice">${escapeHtml(s.notice)}</div>`:''}
  <div class="questions">${sectionBody(s.step)}</div><div id="missNote" class="hidden" aria-live="polite"></div>
  <div class="btnrow"><button class="btn ghost" id="back">← ${s.step===0?'Start':'Previous'}</button><button class="btn" id="next">${last?'Review answers →':'Continue →'}</button></div></section></div>`;
 document.getElementById('mobileJump').onchange=e=>goToStep(Number(e.target.value));
 app.querySelector('#back').onclick=()=>{collect();state.showMissing=false;if(s.step===0)s.view='login';else s.step--;render();window.scrollTo(0,0)};
 app.querySelector('#next').onclick=next;
 bindTesterTools();
 updateLive();
}
function localSummary(a,mode){return {feedback:buildFeedback(a,mode,{},null,null)}}
function meter(label,val,max,avg,hint){const pct=val==null?0:Math.max(2,Math.round(val/max*100));const ap=avg==null||avg==='—'?null:Math.round(avg/max*100);return `<div class="meter"><div class="meter-top"><span>${label}</span><b>${val??'—'}<small> / ${max}</small></b></div><div class="meter-track"><div class="meter-fill" style="width:${pct}%"></div>${ap!==null?`<div class="meter-avg" style="left:${ap}%" title="Cohort average"></div>`:''}</div><small class="meter-hint">${hint}</small></div>`}
function renderFeedback(fb){const p=fb.persona,ix=fb.indices||{},co=fb.cohort;let h='';
 if(p)h+=`<section class="persona"><div class="persona-icon" aria-hidden="true">${escapeHtml(p.icon)}</div><div><span class="eyebrow">YOUR ECONOMICS PERSONA</span><h2>${escapeHtml(p.name)}</h2><p class="persona-tag">${escapeHtml(p.tagline)}</p></div></section><p class="persona-body">${escapeHtml(p.body)}</p><div class="fb-grid"><div class="fb-box"><h3>What you bring</h3><p>${escapeHtml(p.strengths)}</p></div><div class="fb-box try"><h3>Something to try</h3><p>${escapeHtml(p.tryThis)}</p></div></div>`;
 h+=`<div class="meters">${meter('Interest in the subject',ix.interest,100,co&&co.interest,'Why you study it: curiosity, current affairs, effort even without the exam')}${meter('Exam focus',ix.exam,100,co&&co.exam,'How much the A-Level exam drives you right now')}${meter('Curiosity outside lessons',ix.curiosity,3,null,'Past month: reading, discussing, looking things up')}</div>`;
 if(fb.cohortNote)h+=`<p class="note-compact"><span class="avg-key"></span>${escapeHtml(fb.cohortNote)}</p>`;
 if(fb.curiosity)h+=`<p class="fb-line">${escapeHtml(fb.curiosity)}</p>`;
 if(fb.habitsOften.length||fb.habitsToTry.length){h+=`<h3 class="fb-h">Your thinking habits</h3>`;
  if(fb.habitsOften.length)h+=`<p class="note-compact">Questions you already ask often:</p><div class="chips">${fb.habitsOften.map(x=>`<span class="chip-q">${escapeHtml(x.question)}</span>`).join('')}</div>`;
  if(fb.habitsToTry.length)h+=`<p class="note-compact">Questions to try asking more:</p><ul class="fb-list">${fb.habitsToTry.map(x=>`<li><b>${escapeHtml(x.question)}</b><br>${escapeHtml(x.tip)}</li>`).join('')}</ul>`;}
 if(fb.beliefs.length)h+=`<h3 class="fb-h">Ideas worth exploring</h3><p class="note-compact">You agreed with these statements. There is no right answer — here is another angle to test as you learn.</p><ul class="fb-list">${fb.beliefs.map(b=>`<li><b>“${escapeHtml(b.statement)}”</b><span class="pill">you: ${b.rating}/7</span><br>${escapeHtml(b.prompt)}</li>`).join('')}</ul>`;
 if(fb.change){h+=`<h3 class="fb-h">How you have changed since JC1</h3><ul class="fb-list">${fb.change.lines.map(l=>`<li>${escapeHtml(l)}</li>`).join('')}</ul>`;
  if(fb.change.definitionThen||fb.change.definitionNow)h+=`<div class="fb-grid"><div class="fb-box"><h3>JC1 · “Economics is the study of…”</h3><p>${escapeHtml(fb.change.definitionThen||'—')}</p></div><div class="fb-box try"><h3>JC2 · “Economics is the study of…”</h3><p>${escapeHtml(fb.change.definitionNow||'—')}</p></div></div>`;}
 h+=`<p class="note-compact persona-note">${escapeHtml(fb.note)}</p>`;
 return `<div class="feedback">${h}</div>`;}
/* ---------- Server connection (GitHub Pages → Apps Script) ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function api(action,payload,tries=1){
 let last;
 for(let i=0;i<tries;i++){
  try{
   // text/plain avoids a CORS preflight, which Apps Script cannot answer.
   const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},payload)),redirect:'follow'});
   if(!res.ok)throw new Error('HTTP '+res.status);
   const data=await res.json();
   if(data.retry&&i<tries-1){await sleep(Math.min(15000,1000*2**i)+Math.random()*2000);continue}
   return data;
  }catch(e){last=e;if(i<tries-1)await sleep(Math.min(15000,1000*2**i)+Math.random()*2000)}
 }
 throw last||new Error('Could not reach the server.');
}
function modeLocked(m){return(!DEMO&&state.openStage&&state.openStage!==m)?'disabled title="Not open right now"':''}
async function loadConfig(){
 if(DEMO)return;
 try{const r=await api('config',{},3);state.openStage=r.openStage||'CLOSED';if(['JC1','JC2'].includes(state.openStage))state.mode=state.openStage;state.configError=false}
 catch(e){state.configError=true}
 if(state.view==='login')render();
}
/* ---------- Draft autosave on this device (cleared after submitting) ---------- */
function draftKey(){return 'eti-draft:'+state.mode+':'+state.id}
function saveDraft(){if(!state.id||!(state.view==='form'||state.view==='review'))return;try{localStorage.setItem(draftKey(),JSON.stringify({answers:state.answers,step:state.step,token:state.token,startedAt:state.startedAt,savedAt:Date.now()}))}catch(e){}}
function loadDraft(){try{return JSON.parse(localStorage.getItem(draftKey())||'null')}catch(e){return null}}
function clearDraft(){try{localStorage.removeItem(draftKey())}catch(e){}}
function newToken(){const b=new Uint8Array(6);crypto.getRandomValues(b);return Array.from(b,x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()}
function startForm(){
 const d=loadDraft(),total=state.mode==='JC2'?8:7;
 if(d&&d.answers&&Object.keys(d.answers).length){state.answers=d.answers;state.step=Math.min(d.step||0,total-1);state.token=d.token||newToken();state.startedAt=d.startedAt||Date.now();state.notice='Welcome back — we restored the answers saved on this device.'}
 else{state.answers={};state.step=0;state.token=newToken();state.startedAt=Date.now();state.notice=''}
 state.view='form';
}
async function login(){
 const s=state;s.id=app.querySelector('#loginId').value.trim().toUpperCase();s.key=app.querySelector('#loginKey').value.replace(/[\s-]/g,'').toUpperCase();s.error='';
 if(DEMO){startForm();render();return}
 if(!s.id||!s.key){s.error='Enter the assigned student ID and private access key.';render();return}
 s.busy=true;render();
 try{const r=await api('verify',{studentId:s.id,accessKey:s.key,mode:s.mode},3);s.busy=false;if(r.ok){s.tester=!!r.tester;startForm()}else s.error=r.message||'Unable to sign in.'}
 catch(e){s.busy=false;s.error='Could not reach the server. Check your internet connection and try again.'}
 render();
}
async function submit(){
 const s=state;s.error='';
 if(firstIncomplete()<total()){s.view='form';s.step=firstIncomplete();s.showMissing=true;render();return}
 const motives=SCHEMA.motives.map((_,i)=>i).filter(i=>s.answers['G1_'+i]===true);
 if(motives.length>3){s.error='Please select at most three motivations in Section G.';render();return}
 if(!Object.values(s.answers).some(v=>v!==false&&String(v).trim())){s.error='Please answer at least one question before submitting.';render();return}
 const finish=(receipt,summary)=>{s.summary=summary&&summary.feedback?summary:localSummary(s.answers,s.mode);s.copy=buildCopy(s.answers,s.mode,receipt)+'\n\n========== YOUR FEEDBACK ==========\n\n'+feedbackText(s.summary.feedback);s.receipt=receipt;clearDraft();s.view='done';s.key='';s.answers={}};
 if(DEMO){finish('DEMO-'+newToken().slice(0,6),localSummary(s.answers,s.mode));render();return}
 s.busy=true;render();
 try{const r=await api('submit',{studentId:s.id,accessKey:s.key,mode:s.mode,answers:s.answers,clientToken:s.token,startedAt:s.startedAt},6);s.busy=false;
  if(r.ok)finish(r.receipt,r.summary);else s.error=(r.message||'Submission failed.')+(r.retry?'':' Your answers are still saved on this device.')}
 catch(e){s.busy=false;s.error='Could not reach the server. Your answers are saved on this device — check your connection and press Submit again.'}
 render();
}
/* ---------- Student copy (replaces email, which cannot work across domains) ---------- */
function buildCopy(a,mode,receipt){
 const L=['Economic Thinking Inventory — '+mode,'Receipt: '+receipt,'Saved: '+new Date().toLocaleString(),''];
 const add=(t,v)=>{if(v!==undefined&&v!==null&&v!==''&&v!==false)L.push(t,'   '+String(v).replace(/\n/g,'\n   '),'')};
 add('A2. Economics is the study of…',a.A2);
 SCHEMA.associations.forEach((t,i)=>add(`A1. How strongly you associate Economics with "${t}" (1–7)`,a['A1_'+i]));
 SCHEMA.scenarios.forEach(([id,title,p])=>add(`${id}. ${title} — ${p}`,a[id]));
 add('C1. Unlimited free electricity: would all economic problems disappear?',a.C1);
 [0,1,2].forEach(j=>add(`D2. Your question ${j+1} about “${SCHEMA.headline[mode]}”`,a['D2_'+j]));
 SCHEMA.habits.forEach((t,i)=>add(`D1. How often you ask "${t}" (1–7)`,a['D1_'+i]));
 SCHEMA.beliefs.forEach((t,i)=>add(`E1. Agreement with "${t}" (1–7)`,a['E1_'+i]));
 add('E2. Your explanation',a.E2);
 const F=['Never','Once','A few times','Weekly or more'];
 SCHEMA.curiosity.forEach((t,i)=>add(`F${i+1}. ${t}`,F[a['F_'+i]]));
 add('G1. Why you took H1 Economics',SCHEMA.motives.filter((_,i)=>a['G1_'+i]===true).join('; '));
 add('G1. Other reason',a.G1_other);
 SCHEMA.goals.forEach((t,i)=>add(`G2. Importance of "${t}" (1–7)`,a['G2_'+i]));
 add('G3. Effort if there were no A-Level exam (1–7)',a.G3);add('G3. Why',a.G3_why);
 add(mode==='JC1'?'G4. The person you hope Economics helps you become':'G4. The person Economics has helped you become',a.G4);
 if(mode==='JC2')SCHEMA.reflection.forEach((t,i)=>add(`H${i+1}. ${t}`,a['H'+(i+1)]));
 return L.join('\n');
}
function downloadCopy(){const u=URL.createObjectURL(new Blob([state.copy||''],{type:'text/plain;charset=utf-8'}));const x=document.createElement('a');x.href=u;x.download=`${state.receipt}-${state.mode}.txt`;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
app.addEventListener('input',e=>{if(state.view==='form'&&e.target.id!=='mobileJump'){collect();updateLive()}});
app.addEventListener('change',e=>{if(state.view!=='form'||e.target.id==='mobileJump')return;const t=e.target;
 if(t.type==='checkbox'&&/^G1_\d$/.test(t.dataset.key||'')&&t.checked){const n=SCHEMA.motives.filter((_,i)=>{const b=app.querySelector('[data-key="G1_'+i+'"]');return b&&b.checked}).length;if(n>3){t.checked=false;const g=document.getElementById('g1note');if(g)g.textContent='You can choose up to three. Untick one to choose another.'}}
 collect();if(t.dataset.key==='G1_8'){const y=window.scrollY;render();window.scrollTo(0,y);return}updateLive()});
window.addEventListener('beforeunload',e=>{if(state.view==='form'||state.view==='review'){e.preventDefault();e.returnValue=''}});
render();loadConfig();
</script></body></html>
