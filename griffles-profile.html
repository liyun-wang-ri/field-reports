<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Griffles Profile</title>
<!-- Griffles Profile (GRIFFLES-PROFILE): every trailer Post on one Instagram-style page. Built by build.py; the post engine is engine/post-lib.js, its styles come from engine/post.html. -->
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: a phone-width social profile. Header, topic circles, a 3-column post grid, and a passport tab. */
:root{
  --paper:#E7EEEC; --card:#FBFCFA; --ink:#16232A; --muted:#55666C; --rule:#D3DCD9;
  --accent:#0E6B66; --accent-ink:#FFFFFF; --note:#CFEEDF; --note-ink:#10362A;
  --ca:#B5532C; --cb:#2F5DA8; --sea:#DCE8EA; --land:#C4CFCB; --stamp:#F2E9D8; --ca-bg:#F6E3D9; --cb-bg:#DEE7F5; --HOME:#2F5DA8;
  --display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"Literata",Georgia,serif;
  --hand:"Kalam","Comic Neue","Segoe Print",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11191C; --card:#1A252A; --ink:#E3EAE8; --muted:#9AABAF; --rule:#2E3B40;
  --accent:#4DBDB3; --accent-ink:#0B1517; --note:#1E4A3B; --note-ink:#D3F1E3;
  --ca:#E08A62; --cb:#7FA6EA; --sea:#16262C; --land:#33444A; --stamp:#2A3530; --ca-bg:#3A2820; --cb-bg:#1F2C40; --HOME:#7FA6EA; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11191C; --card:#1A252A; --ink:#E3EAE8; --muted:#9AABAF; --rule:#2E3B40;
  --accent:#4DBDB3; --accent-ink:#0B1517; --note:#1E4A3B; --note-ink:#D3F1E3;
  --ca:#E08A62; --cb:#7FA6EA; --sea:#16262C; --land:#33444A; --stamp:#2A3530; --ca-bg:#3A2820; --cb-bg:#1F2C40; --HOME:#7FA6EA; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:0}
.demo-note{max-width:470px;margin:0 auto 12px;font-family:var(--display);font-size:13px;color:var(--muted)}
.profile{max-width:470px;margin:0 auto;background:var(--card);border-radius:14px;box-shadow:0 0 0 1px var(--rule);overflow:hidden}

/* header */
.top{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:18px 18px 10px}
.ava{width:86px;height:86px;border-radius:50%;padding:3px;background:conic-gradient(var(--ca),var(--cb),var(--accent),var(--ca))}
.ava img{width:100%;height:100%;border-radius:50%;background:var(--card);border:3px solid var(--card);object-fit:contain;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:4px}
.stats b{display:block;font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
.stats span{font-family:var(--display);font-size:12.5px;color:var(--muted)}
.bio{padding:0 18px 14px;display:flex;flex-direction:column;gap:4px}
.bio .nm{font-family:var(--display);font-weight:700;font-size:16px}
.bio .role{font-family:var(--display);font-size:13px;color:var(--muted)}
.bio p{font-size:15px}
.cta{display:flex;gap:8px;padding:0 18px 16px}
.cta a,.cta button{flex:1;text-align:center;font-family:var(--display);font-weight:600;font-size:14.5px;border-radius:9px;padding:9px;text-decoration:none;border:0}
.cta .pri{background:var(--accent);color:var(--accent-ink)}
.cta .sec{background:var(--paper);color:var(--ink)}

/* topic circles */
.hl{display:flex;gap:14px;overflow-x:auto;padding:4px 18px 16px;scrollbar-width:none}
.hl::-webkit-scrollbar{display:none}
.hlb{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;width:72px}
.hlb .ring{width:64px;height:64px;border-radius:50%;padding:2px;background:var(--rule);display:grid;place-items:center}
.hlb .in{width:100%;height:100%;border-radius:50%;background:var(--card);border:3px solid var(--card);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink)}
.hlb[aria-pressed="true"] .ring{background:conic-gradient(var(--ca),var(--cb),var(--accent),var(--ca))}
.hlb .lb{font-family:var(--display);font-size:12px;line-height:1.2;text-align:center}
.hlb.soon .in{color:var(--muted)}
.hlb.soon .lb{color:var(--muted)}

/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule)}
.tab{background:none;border:0;border-top:2px solid transparent;margin-top:-1px;padding:10px;font-family:var(--display);font-weight:600;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{border-top-color:var(--ink);color:var(--ink)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tile{position:relative;aspect-ratio:1/1;max-width:100%;border:0;padding:0;background:var(--sea);overflow:hidden;text-align:left}
.tile svg{position:absolute;inset:0;width:180%;height:auto;left:-40%;top:8%}
.tile svg text{display:none}
.tile .lbl{position:absolute;left:6px;right:6px;bottom:6px;font-family:var(--display);font-weight:700;font-size:12.5px;line-height:1.15;color:var(--ink);background:color-mix(in srgb,var(--card) 82%,transparent);border-radius:6px;padding:4px 6px}
.tile .code{position:absolute;top:6px;left:6px;font-family:var(--display);font-weight:600;font-size:10.5px;background:var(--ink);color:var(--card);border-radius:999px;padding:1px 7px}
.tile .seen{position:absolute;top:6px;right:6px;font-family:var(--display);font-size:10.5px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px}
.tile.locked{background:var(--paper);display:grid;place-items:center;cursor:default}
.tile.locked .q{font-family:var(--hand);font-size:26px;color:var(--muted)}
.tile.locked .lbl{background:none;color:var(--muted);font-weight:600;text-align:center}
.empty{padding:22px 18px;color:var(--muted);font-size:15px;text-align:center}

/* passport */
.pass{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:18px}
.st{aspect-ratio:1/1.15;max-width:100%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--rule);background:var(--stamp);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:6px;font-family:var(--display)}
.st:nth-child(odd){transform:rotate(-3deg)} .st:nth-child(even){transform:rotate(2.5deg)}
.st b{font-size:24px;letter-spacing:.04em}
.st span{font-size:11.5px;color:var(--muted)}
.st.a b{color:var(--ca)} .st.b b{color:var(--cb)}
.st.no{background:transparent;border-style:dashed;box-shadow:none;border-color:var(--rule)}
.st.no b{color:var(--rule)}
.passnote{padding:0 18px 18px;font-size:14px;color:var(--muted)}

/* post viewer: tapping a tile opens the posts as a feed over the profile, starting with the one tapped */
.viewer{position:fixed;inset:0;z-index:5;background:var(--paper);overflow-y:auto;overscroll-behavior:contain}
.vbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:6px;background:var(--card);border-bottom:1px solid var(--rule);
  padding:6px 12px;padding-top:max(6px,env(safe-area-inset-top,0px))}
.vbar .back{background:none;border:0;font-size:28px;line-height:1;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;padding:0 0 3px}
.vbar .t{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.15}
.vbar .t small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.feed{max-width:470px;margin:0 auto;padding:16px 0 48px;display:flex;flex-direction:column;gap:18px}
.feed .more{font-family:var(--display);font-size:13.5px;color:var(--muted);text-align:center}
.feed .end{font-family:var(--display);font-size:13.5px;color:var(--muted);text-align:center;padding:0 16px}
@media (max-width:520px){.feed{padding-top:0;gap:12px}}
body.lock{overflow:hidden}
.feed > article{width:100%}
.viewer :root[data-theme="dark"]{--paper:#11191C; --card:#1A252A; --ink:#E3EAE8; --muted:#9AABAF; --rule:#2E3B40;
  --accent:#4DBDB3; --accent-ink:#0B1517; --note:#1E4A3B; --note-ink:#D3F1E3;
  --ca:#E08A62; --cb:#7FA6EA; --ca-bg:#3A2820; --cb-bg:#1F2C40; --sea:#16262C; --land:#33444A; --stamp:#2A3530; color-scheme:dark}
.viewer .post{max-width:470px;margin:0 auto;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--rule)}
@media (max-width:520px){.viewer .post{border-radius:0;box-shadow:none;border-bottom:1px solid var(--rule)}}
.viewer .who{display:flex;align-items:center;gap:10px;padding:10px 14px}
.viewer .ava{width:40px;height:40px;border-radius:50%;flex:none;padding:2px;background:conic-gradient(var(--ca),var(--cb),var(--accent),var(--ca))}
.viewer .ava img{width:100%;height:100%;border-radius:50%;background:var(--card);object-fit:contain;display:block;border:2px solid var(--card)}
.viewer .who .nm{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.2}
.viewer .who .loc{font-family:var(--display);font-size:13px;color:var(--muted);line-height:1.2}
.viewer .who .tag{margin-left:auto;font-family:var(--display);font-size:12px;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:3px 10px;white-space:nowrap}
.viewer .media{position:relative;container-type:inline-size}
.viewer .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.viewer .track::-webkit-scrollbar{display:none}
.viewer .slide{flex:0 0 100%;aspect-ratio:4/5;scroll-snap-align:center;scroll-snap-stop:always;position:relative;overflow:hidden;
  display:flex;flex-direction:column;padding:7cqw 7cqw 8cqw;gap:3cqw}
.viewer .count{position:absolute;top:12px;right:12px;z-index:2;font-family:var(--display);font-size:12px;font-weight:600;
  background:rgba(10,20,24,.62);color:#fff;border-radius:999px;padding:3px 9px;pointer-events:none}
.viewer .arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:34px;height:34px;border-radius:50%;border:0;
  background:rgba(251,252,250,.88);color:#16232A;cursor:pointer;font-size:18px;line-height:34px;display:none;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.viewer .arrow.l{left:10px}
.viewer .arrow.r{right:10px}
@media (hover:hover) and (pointer:fine){.viewer .arrow{display:block}
.viewer .arrow[disabled]{display:none}}
.viewer .dots{display:flex;justify-content:center;gap:5px;padding:10px 0 2px}
.viewer .dots i{width:6px;height:6px;border-radius:50%;background:var(--rule);transition:background .2s}
.viewer .dots i.on{background:var(--accent)}
.viewer .dots i.locked{background:transparent;box-shadow:inset 0 0 0 1px var(--rule)}
.viewer .s-front{background:var(--sea);padding:0;gap:0}
.viewer .s-front .air{position:absolute;inset:0;border:9px solid transparent;
  border-image:repeating-linear-gradient(-45deg,var(--ca) 0 12px,var(--card) 12px 19px,var(--cb) 19px 31px,var(--card) 31px 38px) 9;pointer-events:none}
.viewer .s-front .map{padding:25cqw 0 0;margin:0 -10cqw}
.viewer .s-front .map svg text{fill:var(--ink)}
.viewer .s-front .map.full{margin:0 3cqw}
.viewer .s-front .map svg{width:100%;height:auto;display:block;font-family:var(--display);font-size:13px}
.viewer .s-front .greet{margin-top:auto;padding:0 8cqw 10cqw;font-family:var(--hand);font-weight:700;font-size:10.5cqw;line-height:1.02;color:var(--ink)}
.viewer .s-front .greet small{display:block;font-family:var(--display);font-weight:600;font-size:3.6cqw;color:var(--muted);margin-bottom:1.5cqw}
.viewer .s-front .km{padding:0 8cqw 9cqw;font-family:var(--display);font-size:3.9cqw;color:var(--muted)}
.viewer .postmark{position:absolute;top:7cqw;left:7cqw;width:21cqw;height:21cqw;border:2px solid var(--muted);border-radius:50%;display:grid;place-items:center;text-align:center;
  font-family:var(--display);font-size:2.7cqw;line-height:1.25;color:var(--muted);transform:rotate(-12deg);opacity:.75}
.viewer .stamp{position:absolute;top:6cqw;right:7cqw;width:20cqw;background:var(--stamp);padding:1.4cqw;text-align:center;font-family:var(--display);font-size:2.8cqw;font-weight:700;color:var(--ca);
  border:3px solid var(--card);box-shadow:0 0 0 1px var(--rule);transform:rotate(4deg)}
.viewer .stamp img{width:70%;display:block;margin:1cqw auto 0}
.viewer .s-split{padding:0;gap:0}
.viewer .half{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.6cqw;padding:5cqw 8cqw}
.viewer .half.ca{background:var(--ca-bg)}
.viewer .half.cb{background:var(--cb-bg)}
.viewer .half .k{font-family:var(--display);font-weight:600;font-size:3.8cqw}
.viewer .half.ca .k{color:var(--ca)}
.viewer .half.cb .k{color:var(--cb)}
.viewer .half .v{font-family:var(--display);font-weight:700;font-size:12cqw;line-height:.95;letter-spacing:-.02em}
.viewer .half .b{font-size:3.9cqw;line-height:1.4}
.viewer .vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:12cqw;height:12cqw;border-radius:50%;background:var(--card);
  display:grid;place-items:center;font-family:var(--hand);font-weight:700;font-size:4.6cqw;box-shadow:0 0 0 1px var(--rule)}
.viewer .s-vote{background:var(--card);justify-content:center}
.viewer .s-vote .q{font-family:var(--display);font-weight:700;font-size:7.6cqw;line-height:1.08;text-wrap:balance}
.viewer .poll{display:flex;flex-direction:column;gap:2cqw;margin-top:1.5cqw}
.viewer .poll button{border:1.5px solid var(--rule);background:var(--card);border-radius:999px;padding:2.8cqw 5cqw;font-family:var(--display);font-weight:600;font-size:4.4cqw;
  text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
.viewer .poll button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.viewer .poll button[disabled]:not([aria-pressed="true"]){opacity:.55;cursor:default}
.viewer .poll .gb{font-family:var(--hand);font-weight:400;font-size:3.6cqw;opacity:.85}
.viewer .g{display:grid;grid-template-columns:12cqw 1fr;gap:2.4cqw;align-items:start}
.viewer .g img{width:12cqw;height:auto}
.viewer .bub{background:var(--note);color:var(--note-ink);border-radius:14px;padding:2.4cqw 3.6cqw;font-family:var(--hand);font-size:4.4cqw;line-height:1.35}
.viewer .hint{font-family:var(--display);font-size:3.6cqw;color:var(--muted)}
.viewer .s-twist{background:var(--cb-bg);justify-content:center}
.viewer .s-twist .k{font-family:var(--display);font-weight:600;font-size:4cqw;color:var(--cb)}
.viewer .s-twist .big{font-family:var(--display);font-weight:700;font-size:17cqw;line-height:.92;letter-spacing:-.03em;color:var(--cb)}
.viewer .s-twist .b{font-size:4.2cqw;line-height:1.42}
.viewer .s-twist .but{margin-top:3cqw;border-top:1.5px dashed var(--cb);padding-top:4cqw;display:flex;flex-direction:column;gap:1.6cqw}
.viewer .s-twist .but .k{color:var(--ca)}
.viewer .s-twist.sa{background:var(--ca-bg)}
.viewer .s-twist.sa > .k,.viewer .s-twist.sa .big{color:var(--ca)}
.viewer .s-twist.sa .but{border-top-color:var(--ca)}
.viewer .s-twist.sa .but .k{color:var(--cb)}
.viewer .s-next{background:var(--note);justify-content:center;align-items:flex-start}
.viewer .s-next img.big-g{width:30cqw;height:auto;align-self:center}
.viewer .s-next .ask{font-family:var(--hand);font-weight:700;font-size:8.6cqw;line-height:1.1;color:var(--note-ink);text-wrap:balance;align-self:stretch;text-align:center}
.viewer .rate{align-self:stretch;display:flex;flex-direction:column;gap:2cqw;margin-top:2cqw}
.viewer .rate .lab{font-family:var(--display);font-weight:600;font-size:4.2cqw;text-align:center;color:var(--note-ink)}
.viewer .rate .chips{display:flex;justify-content:center;gap:2.4cqw}
.viewer .rate .chips button{width:12cqw;height:12cqw;min-width:44px;min-height:44px;border-radius:50%;border:1.5px solid var(--note-ink);background:transparent;color:var(--note-ink);
  font-family:var(--display);font-weight:700;font-size:4.6cqw;cursor:pointer}
.viewer .rate .chips button[aria-pressed="true"]{background:var(--note-ink);color:var(--note)}
.viewer .rate .ends{display:flex;justify-content:space-between;font-family:var(--display);font-size:3.4cqw;color:var(--note-ink);opacity:.8;padding:0 6cqw}
.viewer .bar{padding:8px 14px 4px;display:flex;flex-direction:column;gap:8px}
.viewer .btn{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.25;background:var(--accent);color:var(--accent-ink);border:1.5px solid var(--accent);border-radius:10px;
  padding:12px 16px;cursor:pointer;text-decoration:none;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;width:100%}
.viewer .btn small{font-weight:500;font-size:13px;opacity:.85;white-space:nowrap}
.viewer .btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.viewer .btn[disabled]{opacity:.4;cursor:not-allowed}
.viewer .later{background:none;border:0;color:var(--muted);font-family:var(--display);font-size:14px;padding:6px;cursor:pointer;text-decoration:underline;align-self:center}
.viewer .thanks{font-family:var(--display);color:var(--accent);text-align:center;font-size:15px}
.viewer .cap{padding:6px 14px 14px;font-size:15px;line-height:1.5}
.viewer .cap b{font-family:var(--display);font-weight:700;margin-right:6px}
.viewer .cap .hand{font-family:var(--hand);font-size:17px;line-height:1.4}
.viewer .src{padding:0 14px 14px;font-size:12.5px;color:var(--muted);line-height:1.45}
.viewer .src a{color:var(--muted)}
@media (prefers-reduced-motion: no-preference){.viewer .track{scroll-behavior:smooth}
.viewer .pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}}
</style>

nchor=\"middle\">about 8,530 km<\/text><\/svg>","variant":"profile"},{"format":"postcard","id":"PC-MF-01","topicCode":"MF","seq":1,"title":"Negative Externality in Consumption","places":"Kenya & Singapore","minutes":3,"contexts":[{"id":"KE","name":"Kenya","city":"Nairobi, Kenya","slot":"a"},{"id":"SG","name":"Singapore","city":"Singapore","slot":"b"}],"sources":{"nema":{"label":"The Star (Kenya), 2020","url":"https://www.the-star.co.ke/news/2020-02-03-nema-plans-crackdown-as-banned-plastics-resurface"},"boell":{"label":"Heinrich Böll Stiftung Nairobi","url":"https://ke.boell.org/en/node/1107"},"nea":{"label":"NEA, bag charge rules","url":"https://www.nea.gov.sg/our-services/waste-management/disposable-carrier-bag-charge"},"mse25":{"label":"MSE written reply, 4 Mar 2025","url":"https://www.mse.gov.sg/latest-news/written-reply-to-parliamentary-question-on-disposable-carrier-bag-charge-mar-2025/"},"nation":{"label":"Daily Nation, Jul 2019 (NEMA)","url":"https://www.nation.co.ke/news/Plastic-bags-ban-faces-major-obstacle/1056-5181172-k3fdcm/index.html"},"unep":{"label":"UNEP, Kenya–Uganda border report","url":"https://unep.org/news-and-stories/story/how-smuggling-threatens-undermine-kenyas-plastic-bag-ban"},"nemaPen":{"label":"NEMA chairman's statement on the ban (2017)","url":"https://www.nema.go.ke/images/Docs/Notices/Chairman_statement_on_ban_of_plastic_bags.pdf"}},"postcard":{"kicker":"A postcard from Griffles","headline":"Greetings from Nairobi, Kenya","front":{"mapCaption":"Nairobi is about 7,450 km from Singapore.","photo":{"label":"A giraffe in Nairobi National Park, with the city skyline behind","url":"https://commons.wikimedia.org/wiki/File:A_giraffe_with_a_beautiful_background_of_Nairobi_City_Skyline.jpg"},"postmark":"NAIROBI\nKENYA","stamp":"KENYA","message":"Hello from Nairobi! I came to see what happened when Kenya banned plastic bags. Back home in Singapore you just pay 5 cents for one. Same bag, opposite moves. I can't work out which was smarter. Can you?","to":"To: you, Singapore","button":"Read the puzzle"},"puzzle":{"heading":"Same bag, opposite moves","cards":[{"ctx":"KE","title":"Kenya: ban it","body":"In 2017, Kenya made it illegal to make, sell or import plastic carrier bags.","sources":["nema"]},{"ctx":"SG","title":"Singapore: price it","body":"Since 2023, large supermarkets must charge at least 5 cents for each plastic bag.","sources":["nea"]}],"question":"Which move do you think worked better?","options":[{"id":"ban","text":"Kenya's ban"},{"id":"charge","text":"Singapore's 5-cent charge"},{"id":"same","text":"About the same"}],"griffles":"I'd bet on the ban. If bags are illegal, surely they just disappear?","button":"See what happened","betOn":"ban","caption":"Same bag, opposite moves. Two places, one plastic bag, opposite rules."},"twist":{"heading":"Kenya didn't go easy","big":"Up to 4 years","paras":["Breaking Kenya's ban can mean up to four years in prison, or a fine of 2 to 4 million shillings.","Take a plastic bag at a big supermarket and you pay 5 cents. That's it."],"meanwhile":"Meanwhile in Singapore","sources":["nemaPen","nea"],"griffles":"Prison against five cents? Surely prison works better.","button":"Griffles's question","ctx":"KE"},"next":{"griffles":"Prison or five cents: which one actually cut plastic bags more? I'm going to find out in my full Field Report.","question":"How curious are you now?","low":"Not really","high":"Very","links":[{"id":"fieldreport","pkg":"fr-mf-01-lite","label":"Open the Field Report","note":"about 12 minutes","url":"https://liyun-wang-ri.github.io/field-reports/fr-mf-01-lite-ke-sg.html"},{"id":"deepdive","pkg":"fr-mf-01-deepdive","label":"Open the Deep Dive","note":"about 15 minutes, more evidence","url":"https://liyun-wang-ri.github.io/field-reports/fr-mf-01-deepdive-ke-sg.html"}],"later":"Not now","thanks":"Thanks! Griffles has noted it.","ask":"So which one actually cut plastic bags more?","postCaption":"Hold on to your vote. My full Field Report has the real function hl(){
  document.getElementById("hl").innerHTML=TOPICS.map(t=>{const n=t.k==="all"?POSTS.length:POSTS.filter(p=>p.topic===t.k).length;
    return '<button class="hlb'+(n?'':' soon')+'" data-k="'+t.k+'" aria-pressed="'+(topic===t.k)+'"><span class="ring"><span class="in">'+t.short+'</span></span><span class="lb">'+esc(t.name)+(n?'':'<br>coming soon')+'</span></button>'}).join("");
  document.querySelectorAll(".hlb").forEach(b=>b.onclick=()=>{topic=b.dataset.k;tab="posts";render()});
}
function grid(){
  const list=POSTS.filter(p=>topic==="all"||p.topic===topic);
  const locks=topic==="all"?LOCKED.MF+LOCKED.DDSS:(LOCKED[topic]||0);
  if(!list.length&&!locks)return '<p class="empty">No posts here yet.</p>';
  let h='<div class="grid">'+list.map(p=>'<button class="tile" data-id="'+p.id+'" aria-label="'+esc(p.title)+'">'+p.map+
    '<span class="code">'+p.code+'</span>'+(seen[p.id]?'<span class="seen">seen</span>':'')+
    '<span class="lbl">'+p.places.map(x=>esc(x[1])).join(" · ")+'</span></button>').join("");
  for(let i=0;i<locks;i++)h+='<div class="tile locked" aria-label="Locked post"><span class="q">?</span><span class="lbl">Next stop</span></div>';
  h+='</div>';

function passport(){
  const places=[];POSTS.slice().reverse().forEach(p=>p.places.forEach(x=>{if(!places.find(y=>y[0]===x[0]))places.push([...x,p.id])}));
  return '<div class="pass">'+places.map(([cc,name,slot,id])=>'<div class="st '+(seen[id]?slot:"no")+'"><b>'+cc+'</b><span>'+esc(name)+'</span><span>'+(seen[id]?"stamped":"not yet")+'</span></div>').join("")+
    '<div class="st no"><b>?</b><span>Next stop</span></div></div><p class="passnote">Open a post to stamp its places. Stamps are kept on this device only.</p>';
}

  function log(type,data){
    LOG.push({pkg:PID,session:S.session,t:new Date().toISOString(),secs:Math.round((Date.now()-S.start)/1000),screen:SCREENS[S.i],type,data:data||{},from:"profile"});
    try{localStorage.setItem(KEY,JSON.stringify(LOG.slice(-2000)))}catch(e){}
  }
  function sFront(){
    return '<div class="slide s-front" aria-label="Postcard"><div class="postmark">'+esc(F.postmark).replace(/\n/g,"<br>")+'</div>'+
      '<div class="stamp">'+esc(F.stamp)+'<img src="'+IMG+'" alt=""></div><div class="map'+(F.mapFull?' full':'')+'">'+(P.svgWorld||'')+'</div>'+
      '<p class="greet"><small>'+esc(C.kicker)+'</small>'+esc(C.headline)+'</p><div class="air"></div></div>';
  }
  function sSplit(){
    return '<div class="slide s-split" aria-label="'+esc(Z.heading)+'">'+Z.cards.map(c=>{
      const t=String(c.title).split(":"),place=t.length>1?t[0]:cityOf(c.ctx),move=(t.length>1?t.slice(1).join(":"):c.title).trim();
      const yr=(String(c.body).match(/\b(19|20)\d\d\b/)||[""])[0];
      return '<div class="half c'+CTX[c.ctx].slot+'"><span class="k">'+esc(place)+(yr?' · '+yr:'')+'</span><span class="v">'+esc(move.charAt(0).toUpperCase()+move.slice(1))+'.</span><p class="b">'+c.body+'</p></div>';
    }).join("")+'<span class="vs">vs</span></div>';
  }
  function sVote(){
    const gb=(Z.betOn||"ban");
    return '<div class="slide s-vote" aria-label="Vote"><p class="q">'+esc(Z.question)+'</p>'+
      '<div class="poll" role="group" aria-label="'+esc(Z.question)+'">'+Z.options.map(o=>
        '<button type="button" data-v="'+o.id+'" aria-pressed="'+(S.guess===o.id)+'"'+(S.guess?' disabled':'')+'><span>'+esc(o.text)+'</span>'+
        (S.guess&&o.id===gb?'<span class="gb">Griffles</span>':'')+'</button>').join("")+'</div>'+
      (S.guess?'<div class="g pop"><img src="'+IMG+'" alt="Griffles"><div class="bub">'+Z.griffles+'</div></div><p class="hint">Swipe to see what happened.</p>'
              :'<p class="hint">Tap one. Your vote locks once you tap.</p>')+'</div>';
  }
  function sTwist(){
    const [p1,p2]=T.paras;
    return '<div class="slide s-twist'+(T.ctx&&CTX[T.ctx]&&CTX[T.ctx].slot==="a"?' sa':'')+'" aria-label="'+esc(T.heading)+'"><span class="k">'+esc(T.heading)+'</span>'+
      (T.big?'<p class="big">'+esc(T.big)+'</p>':'')+'<p class="b">'+p1+'</p>'+
      (p2?'<div class="but"><span class="k">'+esc(T.meanwhile||("Meanwhile in "+cityOf(Z.cards[0].ctx)))+'</span><p class="b">'+p2+'</p></div>':'')+'</div>';
  }
  function sNext(){
    return '<div class="slide s-next" aria-label="Griffles\'s question"><img class="big-g" src="'+IMG+'" alt="Griffles"><p class="ask">'+esc(N.ask||T.griffles)+'</p>'+
      '<div class="rate"><span class="lab">'+esc(N.question)+'</span><div class="chips">'+[1,2,3,4,5].map(n=>
        '<button type="button" data-n="'+n+'" aria-pressed="'+(S.curious===n)+'" aria-label="'+n+' out of 5">'+n+'</button>').join("")+'</div>'+
      '<div class="ends"><span>'+esc(N.low)+'</span><span>'+esc(N.high)+'</span></div></div></div>';
  }
  const SLIDES=[sFront,sSplit,sVote,sTwist,sNext];
  const open=()=>S.guess?SLIDES.length:VOTE+1;
  function render(keep){
    const x=track.scrollLeft;track.innerHTML=SLIDES.slice(0,open()).map(f=>f()).join("");track.scrollLeft=keep?x:0;bindSlides();ui();
  }
  function bindSlides(){
    track.querySelectorAll(".poll button").forEach(b=>b.onclick=()=>{if(S.guess)return;S.guess=b.dataset.v;log("guess",{guess:S.guess});render(true)});
    track.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{
      S.curious=+b.dataset.n;track.querySelectorAll(".chips button").forEach(x=>x.setAttribute("aria-pressed",x===b));log("curiosity",{value:S.curious});
    });
  }
  function goTo(n){n=Math.max(0,Math.min(open()-1,n));track.scrollTo({left:n*track.clientWidth});setSlide(n)}
  function setSlide(n){
    if(n===S.i)return;
    S.secs[SCREENS[S.i]]=(S.secs[SCREENS[S.i]]||0)+Math.round((Date.now()-S.stepStart)/1000);
    S.i=n;S.seen=Math.max(S.seen,n);S.stepStart=Date.now();log("screen_view");ui();
  }
  let raf=0;
  track.addEventListener("scroll",()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>setSlide(Math.round(track.scrollLeft/Math.max(1,track.clientWidth))))},{passive:true});
  track.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){e.preventDefault();goTo(S.i+1)}if(e.key==="ArrowLeft"){e.preventDefault();goTo(S.i-1)}});
  $(".arrow.l").onclick=()=>goTo(S.i-1);
  $(".arrow.r").onclick=()=>goTo(S.i+1);
  const CAPS=[
    ()=>({hand:true,text:F.message,src:[]}),
    ()=>({text:esc(Z.caption||Z.heading+'.'),src:Z.cards.flatMap(c=>c.sources||[])}),
    ()=>({text:S.guess?'You voted: '+esc((Z.options.find(o=>o.id===S.guess)||{}).text||'')+'. Your vote is locked in.':'Make your call before you see what happened.',src:[]}),
    ()=>({hand:true,text:T.griffles,src:T.sources||[]}),
    ()=>({hand:true,text:N.postCaption||N.griffles,src:[]})
  ];
  function ui(){
    const n=S.i,total=SLIDES.length;
    $(".count").textContent=(n+1)+" / "+total;
    $(".dots").innerHTML=SLIDES.map((_,k)=>'<i class="'+(k===n?"on":k>=open()?"locked":"")+'"></i>').join("");
    $(".arrow.l").disabled=n===0;$(".arrow.r").disabled=n>=open()-1;
    const c=CAPS[n]();
    $(".cap").innerHTML='<b>Griffles</b><span class="'+(c.hand?'hand':'')+'">'+c.text+'</span>';
    const s=$(".src");s.innerHTML=c.src.length?'Sources: '+c.src.map(srcLink).join(" · "):'';s.hidden=!c.src.length;
    const bar=$(".bar");bar.hidden=n<total-1;
    if(n<total-1){bar.innerHTML='';return}
    bar.innerHTML=N.links.map((l,i)=>'<a class="btn'+(i?' ghost':'')+'" href="'+esc(l.url)+'" target="_blank" rel="noopener" data-go="'+esc(l.id)+'"><span>'+esc(l.label)+'</span><small>'+esc(String(l.note).split(",")[0])+'</small></a>').join("")+
      '<button class="later" type="button" data-go="later">'+esc(N.later)+'</button><p class="thanks"'+(S.choice?'':' hidden')+'>'+esc(N.thanks)+'</p>';
    bar.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{
      S.choice=b.dataset.go;log("next_choice",{choice:S.choice,curious:S.curious});$(".thanks").hidden=false;send();
    }));
  }
  function formValues(){
    const pick=(Z.options.find(o=>o.id===S.guess)||{}).text||"";
    const secs={...S.secs};secs[SCREENS[S.i]]=(secs[SCREENS[S.i]]||0)+Math.round((Date.now()-S.stepStart)/1000);
    return {PKG:PID,SES:S.session,DONE:new Date().toISOString(),MIN:Math.max(1,Math.round((Date.now()-S.start)/60000)),TEST:"no",
      PCHO:pick,CONF:S.curious||"",NOTE:"next: "+(S.choice||"left without choosing"),TPS:Object.entries(secs).map(([k,s])=>k+" "+s).join(", ")};
  }
  async function send(){
    if(S.sent)return;S.sent=true;
    if(!CFG.formTemplate||!CFG.autoSubmit){log("not_sent",formValues());return}
    let u;try{u=new URL(CFG.formTemplate)}catch(e){return}
    const v=formValues(),body=new URLSearchParams();
    u.searchParams.forEach((val,key)=>{if(key.startsWith("entry.")){const k=val.replace(/^__|__$/g,"");body.append(key,String(k in v?v[k]:""))}});
    try{await fetch(u.origin+u.pathname.replace(/viewform$/,"formResponse"),{method:"POST",mode:"no-cors",body,keepalive:true});log("sent")}catch(e){log("send_blocked")}
  }
  $(".ava img").src=IMG;
  $(".loc").textContent=(CTX[F.ctx||Z.cards[0].ctx]||{}).city||"";
  $(".tag").textContent=P.id.replace(/^PC-/,"")+" · "+(P.minutes||3)+" min";
  render();log("screen_view");
  return {
    // closing the post or leaving the page counts as leaving: a rated post still sends its row, once
    leave(){if(S.curious&&!S.sent){log("left_after_rating",{curious:S.curious});send()}},
    fit(){track.scrollLeft=S.i*track.clientWidth},
    state:S
  };
}

let live=[],seenObs=null,lastTile=null;
function open(id){
  const v=document.getElementById("viewer"),feed=document.getElementById("feed");
  closeViewer(true);
  lastTile=document.activeElement;
  const list=POSTS.filter(p=>topic==="all"||p.topic===topic);
  const order=[POSTS.find(p=>p.id===id),...list.filter(p=>p.id!==id)];
  feed.innerHTML="";
  seenObs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!seen[e.target.dataset.id]){seen[e.target.dataset.id]=1;save();render()}}),{root:v,threshold:.5});
  order.forEach((p,k)=>{
    if(k===1){const m=document.createElement("p");m.className="more";m.textContent="More from Griffles";feed.appendChild(m)}
    const el=document.createElement("article");feed.appendChild(el);
    live.push(mountPost(el,p.pkg,CFG,IMG));
    el.dataset.id=p.id;seenObs.observe(el);
  });
  const end=document.createElement("p");end.className="end";end.textContent="You're all caught up. New posts unlock as the term goes on.";feed.appendChild(end);
  v.hidden=false;v.scrollTop=0;document.body.classList.add("lock");
  seen[id]=1;save();render();
  setHash(id);
  document.getElementById("back").focus();
}
function closeViewer(quiet){
  live.forEach(x=>x.leave());live=[];
  if(seenObs){seenObs.disconnect();seenObs=null}
  if(quiet)return;
  document.getElementById("viewer").hidden=true;document.body.classList.remove("lock");
  setHash("");
  if(lastTile&&lastTile.dataset&&lastTile.dataset.id){const t=document.querySelector('.tile[data-id="'+lastTile.dataset.id+'"]');if(t)t.focus()}
}
document.getElementById("back").onclick=()=>closeViewer();
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("viewer").hidden)closeViewer()});
window.addEventListener("resize",()=>live.forEach(x=>x.fit()));
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")live.forEach(x=>x.leave())});
window.addEventListener("pagehide",()=>live.forEach(x=>x.leave()));
document.getElementById("tab-posts").onclick=()=>{tab="posts";render()};
document.getElementById("tab-pass").onclick=()=>{tab="pass";render()};
document.getElementById("passBtn").onclick=()=>{tab="pass";render();document.getElementById("tab-pass").scrollIntoView({block:"nearest"})};
// Single-post links: griffles-profile.html#mf-02 opens with that post playing. The address follows the open post.
function setHash(id){try{history.replaceState(null,"",id?"#"+id:location.pathname+location.search)}catch(e){}}
function fromHash(){
  const id=decodeURIComponent(location.hash.slice(1)).toLowerCase(), v=document.getElementById("viewer");
  if(POSTS.some(p=>p.id===id)){if(v.hidden||live.length===0||document.querySelector("#feed article")?.dataset.id!==id)open(id)}
  else if(!v.hidden&&!id)closeViewer();
}
window.addEventListener("hashchange",fromHash);
render();
fromHash();
</script>
