*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;

const CTX={};P.contexts.forEach(c=>CTX[c.id]=c);
const stage=document.getElementById("stage");
const SCREENS=["Postcard","Puzzle","Twist","Next"];
const C=P.postcard;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function srcLink(id){const s=P.sources[id];return s?'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a>':""}
function srcs(ids){return ids&&ids.length?'<p class="src">'+ids.map(srcLink).join(" · ")+'</p>':""}
function slot(id){return CTX[id]?"c"+CTX[id].slot:""}
function G(html){return '<div class="g"><img src="'+IMG+'" alt=""><div class="bub">'+html+'</div></div>'}
function rid(){return Math.random().toString(36).slice(2,8).toUpperCase()}

const S={i:0,max:0,session:rid(),start:Date.now(),stepStart:Date.now(),secs:{},guess:null,locked:false,curious:null,choice:null,sent:false};
let LOG=[];try{LOG=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){LOG=[]}
function log(type,data){
  LOG.push({pkg:PID,session:S.session,t:new Date().toISOString(),secs:Math.round((Date.now()-S.start)/1000),screen:SCREENS[S.i],type,data:data||{}});
  try{localStorage.setItem(KEY,JSON.stringify(LOG.slice(-2000)))}catch(e){}
  document.getElementById("logOut").textContent=JSON.stringify(LOG.filter(e=>e.session===S.session),null,1);
}
function dots(){
  document.getElementById("dots").innerHTML=SCREENS.map((s,i)=>'<span class="'+(i<=S.i?"on":"")+'"></span>').join("")+'<b>'+esc(SCREENS[S.i])+'</b>';
}
function go(n){
  const secs=Math.round((Date.now()-S.stepStart)/1000);S.secs[SCREENS[S.i]]=(S.secs[SCREENS[S.i]]||0)+secs;
  S.i=n;S.max=Math.max(S.max,n);S.stepStart=Date.now();dots();VIEWS[n]();log("screen_view");
  stage.scrollIntoView({behavior:"auto",block:"start"});
}
function back(n){return n>0?'<button class="btn ghost" type="button" data-back>Back</button>':''}
function bindBack(){const b=stage.querySelector("[data-back]");if(b)b.onclick=()=>go(S.i-1)}

/* 1 · the postcard */
function vFront(){
  const F=C.front;
  stage.innerHTML='<div class="airmail turn"><div class="card"><div class="pc">'+
    '<div class="front">'+(P.svgWorld||'')+'<p class="cap">'+esc(F.mapCaption)+'</p>'+
      (F.photo?'<p class="cap"><a href="'+esc(F.photo.url)+'" target="_blank" rel="noopener">'+esc(F.photo.label)+'</a></p>':'')+'</div>'+
    '<div class="back"><div class="stamprow"><div class="postmark">'+esc(F.postmark).replace(/\n/g,"<br>")+'</div>'+
      '<div class="stamp">'+esc(F.stamp)+'<img src="'+IMG+'" alt="Griffles"></div></div>'+
      '<p class="hand">'+F.message+'</p>'+
      '<p class="addr">'+esc(F.to)+'</p></div>'+
  '</div></div></div>'+
  '<div class="row"><button class="btn" type="button" id="next">'+esc(F.button)+'</button></div>';
  document.getElementById("next").onclick=()=>go(1);
}

/* 2 · the puzzle and one guess */
function vPuzzle(){
  const Z=C.puzzle;
  stage.innerHTML='<section class="sheet"><h2>'+esc(Z.heading)+'</h2>'+
    '<div class="pair">'+Z.cards.map(c=>'<div class="fact '+slot(c.ctx)+'"><h3><span class="cc">'+esc(c.ctx)+'</span>'+esc(c.title)+'</h3><p>'+c.body+'</p>'+srcs(c.sources)+'</div>').join("")+'</div>'+
    '<div class="opts" role="radiogroup" aria-label="'+esc(Z.question)+'"><span class="qtext">'+esc(Z.question)+'</span>'+
      Z.options.map(o=>'<label class="opt"><input type="radio" name="g" value="'+o.id+'"'+(S.guess===o.id?" checked":"")+(S.locked?" disabled":"")+'><span>'+esc(o.text)+'</span></label>').join("")+'</div>'+
    '<div class="row">'+back(1)+'<button class="btn" type="button" id="lock"'+(S.guess?'':' disabled')+(S.locked?' hidden':'')+'>Lock it in</button></div>'+
    '<div id="after"></div></section>';
  stage.querySelectorAll('input[name=g]').forEach(r=>r.onchange=()=>{S.guess=r.value;document.getElementById("lock").disabled=false});
  function after(){
    document.getElementById("after").innerHTML='<div style="display:flex;flex-direction:column;gap:14px">'+G(Z.griffles)+
      '<button class="btn" type="button" id="next">'+esc(Z.button)+'</button></div>';
    document.getElementById("next").onclick=()=>go(2);
  }
  document.getElementById("lock").onclick=()=>{S.locked=true;log("guess",{guess:S.guess});vPuzzle()};
  if(S.locked)after();
  bindBack();
}

/* 3 · the twist */
function vTwist(){
  const T=C.twist,pick=(C.puzzle.options.find(o=>o.id===S.guess)||{}).text||"";
  stage.innerHTML='<section class="sheet"><h2>'+esc(T.heading)+'</h2>'+
    (T.big?'<p class="big">'+esc(T.big)+'</p>':'')+
    T.paras.map(p=>'<p>'+p+'</p>').join("")+srcs(T.sources)+
    (pick?'<p class="cap">You bet on: “'+esc(pick)+'”.</p>':'')+
    G(T.griffles)+
    '<div class="row">'+back(2)+'<button class="btn" type="button" id="next">'+esc(T.button)+'</button></div></section>';
  document.getElementById("next").onclick=()=>go(3);
  bindBack();
}

/* 4 · cliffhanger and the way into the full pack */
function vNext(){
  const N=C.next;
  stage.innerHTML='<section class="sheet">'+G(N.griffles)+
    '<span class="qtext">'+esc(N.question)+'</span><div class="chips" id="cur">'+[1,2,3,4,5].map(n=>'<button class="chip" type="button" data-n="'+n+'" aria-pressed="'+(S.curious===n)+'">'+n+'</button>').join("")+'</div>'+
    '<div class="ends"><span>'+esc(N.low)+'</span><span>'+esc(N.high)+'</span></div>'+
    '<div class="row">'+N.links.map((l,i)=>'<a class="btn'+(i?' ghost':'')+'" href="'+esc(l.url)+'" target="_blank" rel="noopener" data-go="'+esc(l.id)+'">'+esc(l.label)+'</a>').join("")+
      '<button class="btn ghost" type="button" data-go="later">'+esc(N.later)+'</button></div>'+
    '<p class="cap">'+N.links.map(l=>esc(l.label)+': '+esc(l.note)).join(" · ")+'</p>'+
    '<p class="thanks" id="thanks" hidden>'+esc(N.thanks)+'</p>'+
    '<div class="row">'+back(3)+'</div></section>';
  stage.querySelectorAll("#cur .chip").forEach(b=>b.onclick=()=>{S.curious=+b.dataset.n;stage.querySelectorAll("#cur .chip").forEach(x=>x.setAttribute("aria-pressed",x===b));log("curiosity",{value:S.curious})});
  stage.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{
    S.choice=b.dataset.go;log("next_choice",{choice:S.choice,curious:S.curious});
    document.getElementById("thanks").hidden=false;send();
  }));
  bindBack();
}
const VIEWS=[vFront,vPuzzle,vTwist,vNext];

/* answers to the shared response form (anonymous). Hosts that block outside requests simply skip this. */
function formValues(){
  const pick=(C.puzzle.options.find(o=>o.id===S.guess)||{}).text||"";
  const secs={...S.secs};secs[SCREENS[S.i]]=(secs[SCREENS[S.i]]||0)+Math.round((Date.now()-S.stepStart)/1000);
  return {PKG:PID,SES:S.session,DONE:new Date().toISOString(),MIN:Math.max(1,Math.round((Date.now()-S.start)/60000)),TEST:"no",
    PCHO:pick,CONF:S.curious||"",NOTE:"next: "+(S.choice||""),TPS:Object.entries(secs).map(([k,s])=>k+" "+s).join(", ")};
}
async function send(){
  if(S.sent||!CFG.formTemplate||!CFG.autoSubmit)return;
  S.sent=true;
  let u;try{u=new URL(CFG.formTemplate)}catch(e){return}
  const v=formValues(),body=new URLSearchParams();
  u.searchParams.forEach((val,key)=>{if(key.startsWith("entry.")){const k=val.replace(/^__|__$/g,"");body.append(key,String(k in v?v[k]:""))}});
  try{await fetch(u.origin+u.pathname.replace(/viewform$/,"formResponse"),{method:"POST",mode:"no-cors",body});log("sent")}catch(e){log("send_blocked")}
}

document.getElementById("hKick").textContent=C.kicker;
document.getElementById("hHead").textContent=C.headline;
dots();vFront();log("screen_view");
</script>
