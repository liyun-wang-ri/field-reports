<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Griffles Post CPE-01</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&family=Kalam:wght@400;700&display=swap">
<style>
/* Griffles Post: the Postcard trailer laid out as one social-style post for phones.
   A swipeable 4:5 carousel (postcard, puzzle, vote, twist, cliffhanger), Griffles's caption underneath, and one action bar.
   Content comes from the same package as the airmail Postcard. */
:root{
  --paper:#E7EEEC; --card:#FBFCFA; --ink:#16232A; --muted:#55666C; --rule:#D3DCD9;
  --accent:#0E6B66; --accent-ink:#FFFFFF; --note:#CFEEDF; --note-ink:#10362A;
  --ca:#B5532C; --cb:#2F5DA8; --ca-bg:#F6E3D9; --cb-bg:#DEE7F5; --sea:#DCE8EA; --land:#C4CFCB; --stamp:#F2E9D8;
  --display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"Literata",Georgia,serif;
  --hand:"Kalam","Comic Neue","Segoe Print",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11191C; --card:#1A252A; --ink:#E3EAE8; --muted:#9AABAF; --rule:#2E3B40;
  --accent:#4DBDB3; --accent-ink:#0B1517; --note:#1E4A3B; --note-ink:#D3F1E3;
  --ca:#E08A62; --cb:#7FA6EA; --ca-bg:#3A2820; --cb-bg:#1F2C40; --sea:#16262C; --land:#33444A; --stamp:#2A3530; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11191C; --card:#1A252A; --ink:#E3EAE8; --muted:#9AABAF; --rule:#2E3B40;
  --accent:#4DBDB3; --accent-ink:#0B1517; --note:#1E4A3B; --note-ink:#D3F1E3;
  --ca:#E08A62; --cb:#7FA6EA; --ca-bg:#3A2820; --cb-bg:#1F2C40; --sea:#16262C; --land:#33444A; --stamp:#2A3530; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding:24px 16px 40px}
a{color:var(--accent)}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.post{max-width:470px;margin:0 auto;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--rule)}
@media (max-width:520px){
  body{padding:0 0 32px}
  .post{border-radius:0;box-shadow:none;border-bottom:1px solid var(--rule)}
}

/* header: who posted it, and from where */
.who{display:flex;align-items:center;gap:10px;padding:10px 14px}
.ava{width:40px;height:40px;border-radius:50%;flex:none;padding:2px;background:conic-gradient(var(--ca),var(--cb),var(--accent),var(--ca))}
.ava img{width:100%;height:100%;border-radius:50%;background:var(--card);object-fit:contain;display:block;border:2px solid var(--card)}
.tapback{cursor:pointer}
.who .nm{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.2}
.who .loc{font-family:var(--display);font-size:13px;color:var(--muted);line-height:1.2}
.who .tag{margin-left:auto;font-family:var(--display);font-size:12px;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:3px 10px;white-space:nowrap}

/* the carousel */
.media{position:relative;container-type:inline-size}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;aspect-ratio:4/5;scroll-snap-align:center;scroll-snap-stop:always;position:relative;overflow:hidden;
  display:flex;flex-direction:column;padding:7cqw 7cqw 8cqw;gap:3cqw}
.count{position:absolute;top:12px;right:12px;z-index:2;font-family:var(--display);font-size:12px;font-weight:600;
  background:rgba(10,20,24,.62);color:#fff;border-radius:999px;padding:3px 9px;pointer-events:none}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:34px;height:34px;border-radius:50%;border:0;
  background:rgba(251,252,250,.88);color:#16232A;cursor:pointer;font-size:18px;line-height:34px;display:none;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.arrow.l{left:10px} .arrow.r{right:10px}
/* arrows show everywhere: some apps don't pass swipes to the page */
.arrow{display:block}.arrow[disabled]{display:none}
@media (hover:none){.arrow{width:30px;height:30px;line-height:30px;font-size:16px;background:rgba(251,252,250,.8)}}
.dots{display:flex;justify-content:center;gap:5px;padding:10px 0 2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--rule);transition:background .2s}
.dots i.on{background:var(--accent)}
.dots i.locked{background:transparent;box-shadow:inset 0 0 0 1px var(--rule)}

/* slide 1: the postcard */
.s-front{background:var(--sea);padding:0;gap:0}
.s-front .air{position:absolute;inset:0;border:9px solid transparent;
  border-image:repeating-linear-gradient(-45deg,var(--ca) 0 12px,var(--card) 12px 19px,var(--cb) 19px 31px,var(--card) 31px 38px) 9;pointer-events:none}
.s-front .map{padding:25cqw 0 0;margin:0 -10cqw}
.s-front .map svg text{fill:var(--ink)}
.s-front .map.full{margin:0 3cqw}
.s-front .map svg{width:100%;height:auto;display:block;font-family:var(--display);font-size:13px}
.s-front .greet{margin-top:auto;padding:0 8cqw 10cqw;font-family:var(--hand);font-weight:700;font-size:10.5cqw;line-height:1.02;color:var(--ink)}
.s-front .greet small{display:block;font-family:var(--display);font-weight:600;font-size:3.6cqw;color:var(--muted);margin-bottom:1.5cqw}
.s-front .km{padding:0 8cqw 9cqw;font-family:var(--display);font-size:3.9cqw;color:var(--muted)}
.postmark{position:absolute;top:7cqw;left:7cqw;width:21cqw;height:21cqw;border:2px solid var(--muted);border-radius:50%;display:grid;place-items:center;text-align:center;
  font-family:var(--display);font-size:2.7cqw;line-height:1.25;color:var(--muted);transform:rotate(-12deg);opacity:.75}
.stamp{position:absolute;top:6cqw;right:7cqw;width:20cqw;background:var(--stamp);padding:1.4cqw;text-align:center;font-family:var(--display);font-size:2.8cqw;font-weight:700;color:var(--ca);
  border:3px solid var(--card);box-shadow:0 0 0 1px var(--rule);transform:rotate(4deg)}
.stamp img{width:70%;display:block;margin:1cqw auto 0}

/* slide 2: two moves */
.s-split{padding:0;gap:0}
.half{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.6cqw;padding:5cqw 8cqw}
.half.ca{background:var(--ca-bg)} .half.cb{background:var(--cb-bg)}
.half .k{font-family:var(--display);font-weight:600;font-size:3.8cqw}
.half.ca .k{color:var(--ca)} .half.cb .k{color:var(--cb)}
.half .v{font-family:var(--display);font-weight:700;font-size:12cqw;line-height:.95;letter-spacing:-.02em}
.half .b{font-size:3.9cqw;line-height:1.4}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:12cqw;height:12cqw;border-radius:50%;background:var(--card);
  display:grid;place-items:center;font-family:var(--hand);font-weight:700;font-size:4.6cqw;box-shadow:0 0 0 1px var(--rule)}

/* slide 3: the vote */
.s-vote{background:var(--card);justify-content:center}
.s-vote .q{font-family:var(--display);font-weight:700;font-size:7.6cqw;line-height:1.08;text-wrap:balance}
.poll{display:flex;flex-direction:column;gap:2cqw;margin-top:1.5cqw}
.poll button{border:1.5px solid var(--rule);background:var(--card);border-radius:999px;padding:2.8cqw 5cqw;font-family:var(--display);font-weight:600;font-size:4.4cqw;
  text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
.poll button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.poll button[disabled]:not([aria-pressed="true"]){opacity:.55;cursor:default}
.poll .gb{font-family:var(--hand);font-weight:400;font-size:3.6cqw;opacity:.85}
.g{display:grid;grid-template-columns:12cqw 1fr;gap:2.4cqw;align-items:start}
.g img{width:12cqw;height:auto}
.bub{background:var(--note);color:var(--note-ink);border-radius:14px;padding:2.4cqw 3.6cqw;font-family:var(--hand);font-size:4.4cqw;line-height:1.35}
.hint{font-family:var(--display);font-size:3.6cqw;color:var(--muted)}

/* slide 4: the twist */
.s-twist{background:var(--cb-bg);justify-content:center}
.s-twist .k{font-family:var(--display);font-weight:600;font-size:4cqw;color:var(--cb)}
.s-twist .big{font-family:var(--display);font-weight:700;font-size:17cqw;line-height:.92;letter-spacing:-.03em;color:var(--cb)}
.s-twist .b{font-size:4.2cqw;line-height:1.42}
.s-twist .but{margin-top:3cqw;border-top:1.5px dashed var(--cb);padding-top:4cqw;display:flex;flex-direction:column;gap:1.6cqw}
.s-twist .but .k{color:var(--ca)}
/* twist about the slot-a place: swap the colours */
.s-twist.sa{background:var(--ca-bg)}
.s-twist.sa > .k,.s-twist.sa .big{color:var(--ca)}
.s-twist.sa .but{border-top-color:var(--ca)}
.s-twist.sa .but .k{color:var(--cb)}

/* slide 5: the cliffhanger */
.s-next{background:var(--note);justify-content:center;align-items:flex-start}
.s-next img.big-g{width:30cqw;height:auto;align-self:center}
.s-next .ask{font-family:var(--hand);font-weight:700;font-size:8.6cqw;line-height:1.1;color:var(--note-ink);text-wrap:balance;align-self:stretch;text-align:center}
.rate{align-self:stretch;display:flex;flex-direction:column;gap:2cqw;margin-top:2cqw}
.rate .lab{font-family:var(--display);font-weight:600;font-size:4.2cqw;text-align:center;color:var(--note-ink)}
.rate .chips{display:flex;justify-content:center;gap:2.4cqw}
.rate .chips button{width:12cqw;height:12cqw;min-width:44px;min-height:44px;border-radius:50%;border:1.5px solid var(--note-ink);background:transparent;color:var(--note-ink);
  font-family:var(--display);font-weight:700;font-size:4.6cqw;cursor:pointer}
.rate .chips button[aria-pressed="true"]{background:var(--note-ink);color:var(--note)}
.rate .ends{display:flex;justify-content:space-between;font-family:var(--display);font-size:3.4cqw;color:var(--note-ink);opacity:.8;padding:0 6cqw}

/* under the picture: the links to the full packs (last slide only), then the caption */
.bar{padding:8px 14px 4px;display:flex;flex-direction:column;gap:8px}
.btn{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.25;background:var(--accent);color:var(--accent-ink);border:1.5px solid var(--accent);border-radius:10px;
  padding:12px 16px;cursor:pointer;text-decoration:none;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;width:100%}
.btn small{font-weight:500;font-size:13px;opacity:.85;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.later{background:none;border:0;color:var(--muted);font-family:var(--display);font-size:14px;padding:6px;cursor:pointer;text-decoration:underline;align-self:center}
.thanks{font-family:var(--display);color:var(--accent);text-align:center;font-size:15px}
.cap{padding:6px 14px 14px;font-size:15px;line-height:1.5}
.cap b{font-family:var(--display);font-weight:700;margin-right:6px}
.cap .hand{font-family:var(--hand);font-size:17px;line-height:1.4}
.src{padding:0 14px 14px;font-size:12.5px;color:var(--muted);line-height:1.45}
.src a{color:var(--muted)}
.foot{max-width:470px;margin:14px auto 0;padding:0 16px;font-size:13px;color:var(--muted);font-family:var(--display)}
details.log{max-width:470px;margin:8px auto 0;padding:0 16px}
details.log summary{cursor:pointer;font-size:13px;color:var(--muted);font-family:var(--display)}
details.log pre{font-size:11px;max-height:240px;overflow:auto;background:var(--card);padding:8px}
@media (prefers-reduced-motion: no-preference){.track{scroll-behavior:smooth}.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}}
@media (hover:hover){.track{user-select:none;-webkit-user-select:none}}
/* Computers (900px and up, with a mouse or trackpad): slides on the left, Griffles's words and buttons on the right */
@media (min-width:900px) and (hover:hover) and (pointer:fine){
 body{background:var(--paper)}
 .post{max-width:min(1000px,calc(100vw - 48px));display:grid;grid-template-columns:calc((100vh - 80px)*.8) 1fr;
   grid-template-rows:auto auto 1fr auto auto;grid-template-areas:"media who" "media cap" "media src" "media dots" "media bar";margin:28px auto}
 .post .media{grid-area:media;align-self:start}
 .post .who{grid-area:who;border-bottom:1px solid var(--rule);padding:14px 16px}
 .post .cap{grid-area:cap;padding:16px 18px 8px;font-size:16px}
 .post .src{grid-area:src;padding:0 18px 12px}
 .post .dots{grid-area:dots;border-top:1px solid var(--rule);padding:12px 0 4px}
 .post .bar{grid-area:bar;padding:8px 18px 18px}
}
</style>

<article class="post" aria-label="Griffles's post">

    <div class="ava"><img id="ava" alt=""></div>

  <div class="media">

</article>
<p class="foot">Anonymous: no names or accounts are recorded.</p>

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function srcLink(id){const s=P.sources[id];return s?'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a>':""}
function rid(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function cityOf(id){return (CTX[id]&&CTX[id].name)||id}

const S={i:0,seen:0,session:rid(),start:Date.now(),stepStart:Date.now(),secs:{},guess:null,curious:null,choice:null,sent:false};
let LOG=[];try{LOG=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){LOG=[]}
function log(type,data){
  LOG.push({pkg:PID,session:S.session,t:new Date().toISOString(),secs:Math.round((Date.now()-S.start)/1000),screen:SCREENS[S.i],type,data:data||{}});
  try{localStorage.setItem(KEY,JSON.stringify(LOG.slice(-2000)))}catch(e){}
  document.getElementById("logOut").textContent=JSON.stringify(LOG.filter(e=>e.session===S.session),null,1);
}

/* slides */
function sFront(){
  const home=(P.contexts.find(c=>c.slot==="b")||{}).name||"";
  return '<div class="slide s-front" aria-label="Postcard">'+
    '<div class="postmark">'+esc(F.postmark).replace(/\n/g,"<br>")+'</div>'+
    '<div class="stamp">'+esc(F.stamp)+'<img src="'+IMG+'" alt=""></div>'+
    '<div class="map'+(F.mapFull?' full':'')+'">'+(P.svgWorld||'')+'</div>'+
    '<p class="greet"><small>'+esc(C.kicker)+'</small>'+esc(C.headline)+'</p>'+
    '<div class="air"></div></div>';
}
function sSplit(){
  return '<div class="slide s-split" aria-label="'+esc(Z.heading)+'">'+Z.cards.map(c=>{
    const t=String(c.title).split(":"),place=t.length>1?t[0]:cityOf(c.ctx),move=(t.length>1?t.slice(1).join(":"):c.title).trim();
    const yr=(String(c.body).match(/\b(19|20)\d\d\b/)||[""])[0];
    return '<div class="half c'+CTX[c.ctx].slot+'"><span class="k">'+esc(place)+(yr?' · '+yr:'')+'</span><span class="v">'+esc(move.charAt(0).toUpperCase()+move.slice(1))+'.</span><p class="b">'+c.body+'</p></div>';
  }).join("")+'<span class="vs">vs</span></div>';
}
function sVote(){
  const gb=(Z.betOn||"ban");
  return '<div class="slide s-vote" aria-label="Vote"><p class="q">'+esc(Z.question)+'</p>'+
    '<div class="poll" id="poll" role="group" aria-label="'+esc(Z.question)+'">'+Z.options.map(o=>
      '<button type="button" data-v="'+o.id+'" aria-pressed="'+(S.guess===o.id)+'"'+(S.guess?' disabled':'')+'><span>'+esc(o.text)+'</span>'+
      (S.guess&&o.id===gb?'<span class="gb">Griffles</span>':'')+'</button>').join("")+'</div>'+
    (S.guess?'<div class="g pop"><img src="'+IMG+'" alt="Griffles"><div class="bub">'+Z.griffles+'</div></div><p class="hint">Swipe to see what happened.</p>'
            :'<p class="hint">Tap one. Your vote locks once you tap.</p>')+'</div>';
}
function sTwist(){
  const [p1,p2]=T.paras;
  return '<div class="slide s-twist'+(T.ctx&&CTX[T.ctx]&&CTX[T.ctx].slot==="a"?' sa':'')+'" aria-label="'+esc(T.heading)+'"><span class="k">'+esc(T.heading)+'</span>'+
    (T.big?'<p class="big">'+esc(T.big)+'</p>':'')+'<p class="b">'+p1+'</p>'+
    (p2?'<div class="but"><span class="k">'+esc(T.meanwhile||("Meanwhile in "+cityOf(Z.cards[0].ctx)))+'</span><p class="b">'+p2+'</p></div>':'')+'</div>';
}
function sNext(){
  return '<div class="slide s-next" aria-label="Griffles\'s question"><img class="big-g" src="'+IMG+'" alt="Griffles">'+
    '<p class="ask">'+esc(N.ask||T.griffles)+'</p>'+
    '<div class="rate"><span class="lab">'+esc(N.question)+'</span><div class="chips" id="cur">'+[1,2,3,4,5].map(n=>
      '<button type="button" data-n="'+n+'" aria-pressed="'+(S.curious===n)+'" aria-label="'+n+' out of 5">'+n+'</button>').join("")+'</div>'+
    '<div class="ends"><span>'+esc(N.low)+'</span><span>'+esc(N.high)+'</span></div></div></div>';
}
const SLIDES=[sFront,sSplit,sVote,sTwist,sNext];
function open(){return S.guess?SLIDES.length:VOTE+1}

function render(keep){
  const x=track.scrollLeft;
  track.innerHTML=SLIDES.slice(0,open()).map(f=>f()).join("");
  track.scrollLeft=keep?x:0;
  bindSlides();ui();
}
function bindSlides(){
  track.querySelectorAll("#poll button").forEach(b=>b.onclick=()=>{
    if(S.guess)return;S.guess=b.dataset.v;log("guess",{guess:S.guess});render(true);
  });
  track.querySelectorAll("#cur button").forEach(b=>b.onclick=()=>{
    S.curious=+b.dataset.n;track.querySelectorAll("#cur button").forEach(x=>x.setAttribute("aria-pressed",x===b));log("curiosity",{value:S.curious});
  });
}
let want=-1,wantT=0;
function goTo(n){n=Math.max(0,Math.min(open()-1,n));want=n;clearTimeout(wantT);wantT=setTimeout(()=>{want=-1},900);track.scrollTo({left:n*track.clientWidth});setSlide(n)}
function setSlide(n){
  if(n===S.i)return;
  const secs=Math.round((Date.now()-S.stepStart)/1000);S.secs[SCREENS[S.i]]=(S.secs[SCREENS[S.i]]||0)+secs;
  S.i=n;S.seen=Math.max(S.seen,n);S.stepStart=Date.now();log("screen_view");ui();
}
let raf=0;
track.addEventListener("scroll",()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const n=Math.round(track.scrollLeft/Math.max(1,track.clientWidth));if(want>=0){if(n!==want)return;want=-1}setSlide(n)})},{passive:true});
// Tapping the right or left side of a slide moves on or back, for apps (like Canvas or Claude on a phone) where swiping inside the page does not work.
// Clicking or tapping the right or left third of a slide moves on or back (phones in apps where swiping does not work, and computers).
const zone=e=>{const r=track.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;return x>2/3?1:x<1/3?-1:0};
let dragX=null,dragged=false;
track.addEventListener("click",e=>{if(dragged){dragged=false;return}if(e.target.closest("button,a,input,textarea,label,summary"))return;const z=zone(e);if(z)goTo(S.i+z)});
// With a mouse, dragging a slide sideways also moves it, like swiping on a phone.
track.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&!e.target.closest("button,a,input,textarea,label"))dragX=e.clientX});
window.addEventListener("pointerup",e=>{if(dragX===null)return;const dx=e.clientX-dragX;dragX=null;if(Math.abs(dx)>40){dragged=true;setTimeout(()=>{dragged=false},0);goTo(S.i+(dx<0?1:-1))}});
track.addEventListener("dragstart",e=>e.preventDefault());
track.addEventListener("mousemove",e=>{if(e.target.closest("button,a,input,textarea,label,summary")){track.style.cursor="";return}const z=zone(e),ok=z&&S.i+z>=0&&S.i+z<open();track.style.cursor=ok?"pointer":""});
track.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){e.preventDefault();goTo(S.i+1)}if(e.key==="ArrowLeft"){e.preventDefault();goTo(S.i-1)}});
// The arrow keys work straight away, without clicking the slides first, while this post is on screen.
document.addEventListener("keydown",e=>{if(e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey||(e.key!=="ArrowRight"&&e.key!=="ArrowLeft"))return;if(e.target.closest&&e.target.closest("input,textarea,select,[contenteditable]"))return;if(!track.offsetParent)return;const r=track.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;e.preventDefault();goTo(S.i+(e.key==="ArrowRight"?1:-1))});
document.getElementById("prev").onclick=()=>goTo(S.i-1);
document.getElementById("nextA").onclick=()=>goTo(S.i+1);
window.addEventListener("resize",()=>{track.scrollLeft=S.i*track.clientWidth});

/* caption, sources and the action bar follow the slide */
const CAPS=[
  ()=>({hand:true,text:F.message,src:[]}),
  ()=>({text:esc(Z.caption||Z.heading+'.'),src:Z.cards.flatMap(c=>c.sources||[])}),
  ()=>({text:S.guess?'You voted: '+esc((Z.options.find(o=>o.id===S.guess)||{}).text||'')+'. Your vote is locked in.':'Make your call before you see what happened.',src:[]}),
  ()=>({hand:true,text:T.griffles,src:T.sources||[]}),
  ()=>({hand:true,text:N.postCaption||N.griffles,src:[]})
];
function ui(){
  const n=S.i,total=SLIDES.length;
  document.getElementById("count").textContent=(n+1)+" / "+total;
  document.getElementById("dots").innerHTML=SLIDES.map((_,k)=>'<i class="'+(k===n?"on":k>=open()?"locked":"")+'"></i>').join("");
  document.getElementById("prev").disabled=n===0;
  document.getElementById("nextA").disabled=n>=open()-1;
  const c=CAPS[n]();
  document.getElementById("cap").innerHTML='<b>Griffles</b><span class="'+(c.hand?'hand':'')+'">'+c.text+'</span>'+(c.extra||'');
  const s=document.getElementById("src");s.innerHTML=c.src.length?'Sources: '+c.src.map(srcLink).join(" · "):'';s.hidden=!c.src.length;
  const bar=document.getElementById("bar");
  bar.hidden=n<total-1;
  if(n<total-1){
    bar.innerHTML='';
  }else{
    bar.innerHTML=N.links.map((l,i)=>'<a class="btn'+(i?' ghost':'')+'" href="'+esc(l.url)+'" target="_blank" rel="noopener" data-go="'+esc(l.id)+'"><span>'+esc(l.label)+'</span><small>'+esc(String(l.note).split(",")[0])+'</small></a>').join("")+
      '<button class="later" type="button" data-go="later">'+esc(N.later)+'</button><p class="thanks" id="thanks"'+(S.choice?'':' hidden')+'>'+esc(N.thanks)+'</p>';
    bar.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{
      S.choice=b.dataset.go;log("next_choice",{choice:S.choice,curious:S.curious});document.getElementById("thanks").hidden=false;send();
    }));
  }
}

/* answers to the shared response form (anonymous). Hosts that block outside requests simply skip this. */
function formValues(){
  const pick=(Z.options.find(o=>o.id===S.guess)||{}).text||"";
  const secs={...S.secs};secs[SCREENS[S.i]]=(secs[SCREENS[S.i]]||0)+Math.round((Date.now()-S.stepStart)/1000);
  return {PKG:PID,SES:S.session,DONE:new Date().toISOString(),MIN:Math.max(1,Math.round((Date.now()-S.start)/60000)),TEST:"no",
    PCHO:pick,CONF:S.curious||"",NOTE:"next: "+(S.choice||"left without choosing"),TPS:Object.entries(secs).map(([k,s])=>k+" "+s).join(", ")};
}
// A student who rates their curiosity and then closes or leaves the page still sends their row (once).
function sendIfLeaving(){if(document.visibilityState==="hidden"&&S.curious&&!S.sent){log("left_after_rating",{curious:S.curious});send()}}
document.addEventListener("visibilitychange",sendIfLeaving);
window.addEventListener("pagehide",()=>{if(S.curious&&!S.sent)send()});
async function send(){
  if(S.sent||!CFG.formTemplate||!CFG.autoSubmit)return;
  S.sent=true;
  let u;try{u=new URL(CFG.formTemplate)}catch(e){return}
  const v=formValues(),body=new URLSearchParams();
  u.searchParams.forEach((val,key)=>{if(key.startsWith("entry.")){const k=val.replace(/^__|__$/g,"");body.append(key,String(k in v?v[k]:""))}});
  try{await fetch(u.origin+u.pathname.replace(/viewform$/,"formResponse"),{method:"POST",mode:"no-cors",body,keepalive:true});log("sent")}catch(e){log("send_blocked")}
}

document.getElementById("ava").src=IMG;
// Like Instagram: tapping Griffles's picture or name opens his profile.
if(CFG.profileUrl)[document.querySelector(".who .ava"),document.querySelector(".who .nm")].forEach(el=>{el.classList.add("tapback");el.setAttribute("role","link");el.tabIndex=0;el.setAttribute("aria-label","Open Griffles's profile");
  const go=()=>{location.href=CFG.profileUrl};el.onclick=go;el.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go()}}});
document.getElementById("loc").textContent=(CTX[F.ctx||Z.cards[0].ctx]||{}).city||"";
document.getElementById("tag").textContent=P.id.replace(/^PC-/,"")+" · "+(P.minutes||3)+" min";
render();log("screen_view");
</script>
