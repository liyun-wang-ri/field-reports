<style>
/* Griffles Postcard: a 3-minute trailer for a Field Report. One airmail postcard from the place, a puzzle, a twist,
   and a cliffhanger that leads to the full pack. Content comes from the JSON block below. */
:root{
  --paper:#E7EEEC; --card:#FBFCFA; --ink:#16232A; --muted:#55666C; --rule:#C9D3D0;
  --accent:#0E6B66; --accent-ink:#FFFFFF; --note:#CFEEDF; --note-ink:#10362A;
  --ca:#B5532C; --cb:#2F5DA8; --sea:#DCE8EA; --land:#C4CFCB; --stamp:#F2E9D8;
  --display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"Literata",Georgia,serif;
  --hand:"Kalam","Comic Neue","Segoe Print",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11191C; --card:#1A252A; --ink:#E3EAE8; --muted:#9AABAF; --rule:#2E3B40;
  --accent:#4DBDB3; --accent-ink:#0B1517; --note:#1E4A3B; --note-ink:#D3F1E3;
  --ca:#E08A62; --cb:#7FA6EA; --sea:#16262C; --land:#33444A; --stamp:#2A3530; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11191C; --card:#1A252A; --ink:#E3EAE8; --muted:#9AABAF; --rule:#2E3B40;
  --accent:#4DBDB3; --accent-ink:#0B1517; --note:#1E4A3B; --note-ink:#D3F1E3;
  --ca:#E08A62; --cb:#7FA6EA; --sea:#16262C; --land:#33444A; --stamp:#2A3530; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,4.6vw,36px)} h2{font-size:23px} h3{font-size:18px}
p{margin:0}
a{color:var(--accent)}
.kicker{font-family:var(--display);font-weight:600;color:var(--accent);font-size:15px}
.lede{color:var(--muted)}

/* progress: four postmarks */
.dots{display:flex;gap:8px;align-items:center;font-family:var(--display);font-size:14px;color:var(--muted)}
.dots span{width:28px;height:6px;border-radius:3px;background:var(--rule)}
.dots span.on{background:var(--accent)}
.dots b{margin-left:6px;font-weight:600}

/* the postcard */
.card{position:relative;background:var(--card);border-radius:6px;padding:14px}
.airmail{background:repeating-linear-gradient(-45deg,var(--ca) 0 14px,var(--card) 14px 22px,var(--cb) 22px 36px,var(--card) 36px 44px);padding:9px;border-radius:8px}
.airmail > .card{border-radius:4px}
.pc{display:grid;grid-template-columns:1.15fr 1fr;gap:0}
.pc .front{padding:6px 18px 6px 4px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:10px}
.pc .back{padding:6px 4px 6px 18px;display:flex;flex-direction:column;gap:14px}
.pc svg{width:100%;height:auto;display:block;font-family:var(--display);font-size:13px}
.pc svg .lbl{font-weight:600}
.cap{font-size:14px;color:var(--muted)}
.stamprow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.postmark{width:92px;height:92px;border:2px solid var(--muted);border-radius:50%;display:grid;place-items:center;text-align:center;
  font-family:var(--display);font-size:11px;line-height:1.25;color:var(--muted);transform:rotate(-12deg);opacity:.8;flex:none}
.stamp{width:96px;flex:none;background:var(--stamp);padding:6px;text-align:center;font-family:var(--display);font-size:12px;font-weight:700;color:var(--ca);
  outline:2px dotted var(--card);outline-offset:-3px;border:3px solid var(--card);box-shadow:0 0 0 1px var(--rule)}
.stamp img{width:64px;height:auto;display:block;margin:2px auto}
.hand{font-family:var(--hand);font-size:20px;line-height:1.45;color:var(--ink)}
.addr{font-family:var(--hand);font-size:17px;border-top:1px solid var(--rule);padding-top:8px;color:var(--muted)}
@media (max-width:620px){
  .pc{grid-template-columns:1fr}
  .pc .front{border-right:0;border-bottom:1px solid var(--rule);padding:4px 4px 14px}
  .pc .back{padding:14px 4px 4px}
  .hand{font-size:19px}
}

/* sheets after the postcard */
.sheet{background:var(--card);border-radius:6px;padding:22px clamp(16px,4vw,28px);display:flex;flex-direction:column;gap:16px;
  border-top:6px solid transparent;border-image:repeating-linear-gradient(90deg,var(--ca) 0 18px,var(--card) 18px 26px,var(--cb) 26px 44px,var(--card) 44px 52px) 6}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.pair{grid-template-columns:1fr}}
.fact{border-left:4px solid var(--rule);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:6px}
.fact.ca{border-color:var(--ca)} .fact.cb{border-color:var(--cb)}
.fact h3 .cc{font-size:13px;margin-right:6px}
.fact.ca .cc{color:var(--ca)} .fact.cb .cc{color:var(--cb)}
.src{font-size:13px;color:var(--muted)}
.src a{color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--card)}
.opt:has(input:checked){border-color:var(--accent)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.qtext{font-family:var(--display);font-weight:600;font-size:18px}
.btn{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.25;background:var(--accent);color:var(--accent-ink);border:1.5px solid var(--accent);border-radius:999px;padding:11px 22px;cursor:pointer;text-decoration:none;display:inline-block;align-self:flex-start}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn:focus-visible,.opt:focus-within,.chip:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.g{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start}
.g img{width:44px;height:auto}
.g .bub{background:var(--note);color:var(--note-ink);border-radius:12px;padding:10px 14px;font-family:var(--hand);font-size:19px;line-height:1.4}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--display);font-size:15px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);width:228px}
.big{font-family:var(--display);font-weight:700;font-size:clamp(36px,8vw,56px);line-height:1;color:var(--cb)}
.thanks{font-family:var(--display);color:var(--accent)}
.foot{font-size:13px;color:var(--muted)}
details.log summary{cursor:pointer;font-size:13px;color:var(--muted)}
details.log pre{font-size:11px;max-height:240px;overflow:auto;background:var(--card);padding:8px}
@media (prefers-reduced-motion: no-preference){.turn{animation:turn .45s ease-out}@keyframes turn{from{transform:rotateY(70deg);opacity:.2}to{transform:none;opacity:1}}}
</style>

const CTX={};P.contexts.forEach(c=>CTX[c.id]=c);
const stage=document.getElementById("stage");
const SCREENS=["Postcard","Puzzle","Twist","Next"];
const C=P.postcard;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function srcLink(id){const s=P.sources[id];return s?'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a>':""}
function srcs(ids){return ids&&ids.length?'<p class="src">'+ids.map(srcLink).join(" · ")+'</p>':""}
function slot(id){return CTX[id]?"c"+CTX[id].slot:""}
function G(html){return '<div class="g"><img src="'+IMG+'" alt=""><div class="bub">'+html+'</div></div>'}
function rid(){return Math.random().toString(36).slice(2,8).toUpperCase()}

const S={i:0,max:0,session:rid(),start:Date.now(),stepStart:Date.now(),secs:{},guess:null,locked:false,curious:null,choice:null,sent:false};
let LOG=[];try{LOG=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){LOG=[]}
function log(type,data){
  LOG.push({pkg:PID,session:S.session,t:new Date().toISOString(),secs:Math.round((Date.now()-S.start)/1000),screen:SCREENS[S.i],type,data:data||{}});
  try{localStorage.setItem(KEY,JSON.stringify(LOG.slice(-2000)))}catch(e){}
  document.getElementById("logOut").textContent=JSON.stringify(LOG.filter(e=>e.session===S.session),null,1);
}
function dots(){
  document.getElementById("dots").innerHTML=SCREENS.map((s,i)=>'<span class="'+(i<=S.i?"on":"")+'"></span>').join("")+'<b>'+esc(SCREENS[S.i])+'</b>';
}
function go(n){
  const secs=Math.round((Date.now()-S.stepStart)/1000);S.secs[SCREENS[S.i]]=(S.secs[SCREENS[S.i]]||0)+secs;
  S.i=n;S.max=Math.max(S.max,n);S.stepStart=Date.now();dots();VIEWS[n]();log("screen_view");
  stage.scrollIntoView({behavior:"auto",block:"start"});
}
function back(n){return n>0?'<button class="btn ghost" type="button" data-back>Back</button>':''}
function bindBack(){const b=stage.querySelector("[data-back]");if(b)b.onclick=()=>go(S.i-1)}

/* 1 · the postcard */
function vFront(){
  const F=C.front;
  stage.innerHTML='<div class="airmail turn"><div class="card"><div class="pc">'+
    '<div class="front">'+(P.svgWorld||'')+'<p class="cap">'+esc(F.mapCaption)+'</p>'+
      (F.photo?'<p class="cap"><a href="'+esc(F.photo.url)+'" target="_blank" rel="noopener">'+esc(F.photo.label)+'</a></p>':'')+'</div>'+
    '<div class="back"><div class="stamprow"><div class="postmark">'+esc(F.postmark).replace(/\n/g,"<br>")+'</div>'+
      '<div class="stamp">'+esc(F.stamp)+'<img src="'+IMG+'" alt="Griffles"></div></div>'+
      '<p class="hand">'+F.message+'</p>'+
      '<p class="addr">'+esc(F.to)+'</p></div>'+
  '</div></div></div>'+
  '<div class="row"><button class="btn" type="button" id="next">'+esc(F.button)+'</button></div>';
  document.getElementById("next").onclick=()=>go(1);
}

/* 2 · the puzzle and one guess */
function vPuzzle(){
  const Z=C.puzzle;
  stage.innerHTML='<section class="sheet"><h2>'+esc(Z.heading)+'</h2>'+
    '<div class="pair">'+Z.cards.map(c=>'<div class="fact '+slot(c.ctx)+'"><h3><span class="cc">'+esc(c.ctx)+'</span>'+esc(c.title)+'</h3><p>'+c.body+'</p>'+srcs(c.sources)+'</div>').join("")+'</div>'+
    '<div class="opts" role="radiogroup" aria-label="'+esc(Z.question)+'"><span class="qtext">'+esc(Z.question)+'</span>'+
      Z.options.map(o=>'<label class="opt"><input type="radio" name="g" value="'+o.id+'"'+(S.guess===o.id?" checked":"")+(S.locked?" disabled":"")+'><span>'+esc(o.text)+'</span></label>').join("")+'</div>'+
    '<div class="row">'+back(1)+'<button class="btn" type="button" id="lock"'+(S.guess?'':' disabled')+(S.locked?' hidden':'')+'>Lock it in</button></div>'+
    '<div id="after"></div></section>';
  stage.querySelectorAll('input[name=g]').forEach(r=>r.onchange=()=>{S.guess=r.value;document.getElementById("lock").disabled=false});
  function after(){
    document.getElementById("after").innerHTML='<div style="display:flex;flex-direction:column;gap:14px">'+G(Z.griffles)+
      '<button class="btn" type="button" id="next">'+esc(Z.button)+'</button></div>';
    document.getElementById("next").onclick=()=>go(2);
  }
  document.getElementById("lock").onclick=()=>{S.locked=true;log("guess",{guess:S.guess});vPuzzle()};
  if(S.locked)after();
  bindBack();
}

/* 3 · the twist */
function vTwist(){
  const T=C.twist,pick=(C.puzzle.options.find(o=>o.id===S.guess)||{}).text||"";
  stage.innerHTML='<section class="sheet"><h2>'+esc(T.heading)+'</h2>'+
    (T.big?'<p class="big">'+esc(T.big)+'</p>':'')+
    T.paras.map(p=>'<p>'+p+'</p>').join("")+srcs(T.sources)+
    (pick?'<p class="cap">You bet on: “'+esc(pick)+'”.</p>':'')+
    G(T.griffles)+
    '<div class="row">'+back(2)+'<button class="btn" type="button" id="next">'+esc(T.button)+'</button></div></section>';
  document.getElementById("next").onclick=()=>go(3);
  bindBack();
}

/* 4 · cliffhanger and the way into the full pack */
function vNext(){
  const N=C.next;
  stage.innerHTML='<section class="sheet">'+G(N.griffles)+
    '<span class="qtext">'+esc(N.question)+'</span><div class="chips" id="cur">'+[1,2,3,4,5].map(n=>'<button class="chip" type="button" data-n="'+n+'" aria-pressed="'+(S.curious===n)+'">'+n+'</button>').join("")+'</div>'+
    '<div class="ends"><span>'+esc(N.low)+'</span><span>'+esc(N.high)+'</span></div>'+
    '<div class="row">'+N.links.map((l,i)=>'<a class="btn'+(i?' ghost':'')+'" href="'+esc(l.url)+'" target="_blank" rel="noopener" data-go="'+esc(l.id)+'">'+esc(l.label)+'</a>').join("")+
      '<button class="btn ghost" type="button" data-go="later">'+esc(N.later)+'</button></div>'+
    '<p class="cap">'+N.links.map(l=>esc(l.label)+': '+esc(l.note)).join(" · ")+'</p>'+
    '<p class="thanks" id="thanks" hidden>'+esc(N.thanks)+'</p>'+
    '<div class="row">'+back(3)+'</div></section>';
  stage.querySelectorAll("#cur .chip").forEach(b=>b.onclick=()=>{S.curious=+b.dataset.n;stage.querySelectorAll("#cur .chip").forEach(x=>x.setAttribute("aria-pressed",x===b));log("curiosity",{value:S.curious})});
  stage.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{
    S.choice=b.dataset.go;log("next_choice",{choice:S.choice,curious:S.curious});
    document.getElementById("thanks").hidden=false;send();
  }));
  bindBack();
}
const VIEWS=[vFront,vPuzzle,vTwist,vNext];

/* answers to the shared response form (anonymous). Hosts that block outside requests simply skip this. */
function formValues(){
  const pick=(C.puzzle.options.find(o=>o.id===S.guess)||{}).text||"";
  const secs={...S.secs};secs[SCREENS[S.i]]=(secs[SCREENS[S.i]]||0)+Math.round((Date.now()-S.stepStart)/1000);
  return {PKG:PID,SES:S.session,DONE:new Date().toISOString(),MIN:Math.max(1,Math.round((Date.now()-S.start)/60000)),TEST:"no",
    PCHO:pick,CONF:S.curious||"",NOTE:"next: "+(S.choice||""),TPS:Object.entries(secs).map(([k,s])=>k+" "+s).join(", ")};
}
async function send(){
  if(S.sent||!CFG.formTemplate||!CFG.autoSubmit)return;
  S.sent=true;
  let u;try{u=new URL(CFG.formTemplate)}catch(e){return}
  const v=formValues(),body=new URLSearchParams();
  u.searchParams.forEach((val,key)=>{if(key.startsWith("entry.")){const k=val.replace(/^__|__$/g,"");body.append(key,String(k in v?v[k]:""))}});
  try{await fetch(u.origin+u.pathname.replace(/viewform$/,"formResponse"),{method:"POST",mode:"no-cors",body});log("sent")}catch(e){log("send_blocked")}
}

document.getElementById("hKick").textContent=C.kicker;
document.getElementById("hHead").textContent=C.headline;
dots();vFront();log("screen_view");
</script>
